latin:{title:'先找候选最少的格子',intro:'这是九鼎之局相关的行列约束基础，不包含旋钮移动。允许存在多个合法解，系统按规则验收。',steps:['每行每列都包含1到n且不重复。先列出一行缺的数字，再看每个空格所在的列。','如果某个空格只有一个候选，先填它。填完后更新相关行列。','发现矛盾时退回最近的假设，不要继续在矛盾上堆数字。提交前逐行逐列检查重复。'],example:'一行已有1、3、4，只缺2。若这个空格所在列没有2，就可确定填2。',pitfall:'把它误当成数独，额外加入宫格约束；填写新数字后没有更新候选。',goal:'先做到全盘无冲突。进阶档提示更少，但仍可接受所有合法答案。'},
gcd:{title:'把数字看成因数之间的连接',intro:'这是数阵迷踪的缩小版：只允许四邻接，且两个数有大于1的公约数。不是按数字大小连线。',steps:['先快速标出2、3、5、7、11等因数。偶数之间至少共享2，能被3整除的数之间共享3。','观察角落和连接少的格子。它们需要提前安排进路径，不能被两头封死。','每一步同时检查：相邻、有公共因数、没走过。点当前终点可退一步；回退不等于失败。'],example:'12与18的最大公约数为6，可以相连；10与21的最大公约数为1，不能相连。',pitfall:'只判断有因数就跨格连线；为了走满局部，提前困住了另一角。',goal:'先完成3×3，记录回退次数和卡住的位置，再扩盘。'},
color:{title:'记“哪里是什么”，而不只记有什么',intro:'颜色记忆与位置绑定需要分别练习。先熟悉0空、1红、2黄、3蓝，再开始限时记忆。',steps:['按行分组，把图案编码为“第几列、什么颜色”。空格同样参与空间定位。','暴露时先建立整体布局，再复查两个容易混淆的位置。不要把所有注意力都放在颜色数量上。','回忆时先填确定的坐标。格子点击循环切色，也可聚焦后按0–3直接设置。数字编号可帮助区分颜色。'],example:'一行“0、1、0、3”编码为“2红、4蓝”。先画出位置，再填颜色。',pitfall:'记住红黄蓝的数量却把位置互换；回忆时把第2行误认为第3行；不熟悉操作导致误填。',goal:'基础3×3有4个色格。稳定后增加到4×4和5×5；每档的暴露时长不同，比较时保持同档。'},
digits:{title:'分组编码，保留遗漏之后的信息',intro:'先从基础档熟悉分组回忆和输入操作，再逐步增加长度。',steps:['把数字串分成3或4位的小组，保持固定节奏。开头的0也是答案的一部分。','回忆时按原分组顺序输出。如果一位不确定，仍继续恢复后面的信息。','提交后用编辑距离查看插入、遗漏或替换。它提供部分分，不代表漏一个数字就完全正确。'],example:'08472916可分为0847｜2916。不要把开头的0自动省略。',pitfall:'把数字串当作数值，丢失前导0；反复默念前半段而错过后半段。',goal:'记录完整正确率和部分分。增加长度与缩短暴露时间不要同时进行。'},
arithmetic:{title:'把正确的过程做稳定',intro:'分别记录答对、答错和跳过的题。先减少操作与进借位失误，再压缩用时。',steps:['加减法按百、十、个位分层，明确每次进位或借位；乘法把一项拆成整十与个位。','保留中间值，避免上一项结果还没稳定就启动下一项。允许负答案。','交之前做一次独立核对：个位或另一种分解。估数量级抓不到所有近似错误，不能当作完整验证。'],example:'386+247=(300+200)+(80+40)+(6+7)=500+120+13=633。个位6+7应得到3，与633一致，但仍要检查十位。',pitfall:'漏进位、重复加一次进位、抄写错位；把核对当成重新做同一路错误过程。',goal:'先做一组5题，错题标出“进借位/抄写/方法不熟/其他”。连续3组稳定后再加难。'},
slide:{title:'先预演三步，再推动空位',intro:'从短步数3×3起步，练习较长序列的稳定执行，再学习更大盘面。',steps:['先找空位的位置。想清楚下一步、再下一步、第三步如何改变空位与目标块的关系。','避免立即撤回上一手。已经排好的区域要有保护策略，必要时先处理一行末尾的两个块。','卡住时回看近期移动，找重复循环。基础/进阶为3×3，挑战为最短8–10步的4×4浅层题，不是完整随机15数码。'],example:'目标块不在空位旁边时，先设计空位绕行路线。短暂把目标块移远，可能是在为正确位置腾出通道。',pitfall:'只盯一块直线靠近目标；反复同一对移动；重置后把探索成本当作不存在。',goal:'先完成，再比较累计步数与最短步数。最短距离来自BFS，分数不与其他维度直接比较。'}

let route=location.hash.slice(1)||'arena',bankDim='全部',bankLevel=1,bankType=null,bankPage=0,search='',lessonId=null,reportId=null,prepared=null,reviewFilter='due',toastTimer;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;const pct=x=>`${Math.round(x*100)}%`;const stamp=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'尚无记录';const sec=ms=>`${(ms/1000).toFixed(1)} 秒`;const id=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
const COLORS=['#f5f5f8','#e99b99','#f3d770','#8fb2e4'];const MOD=['#343746','#e89999','#efb980','#f2d989','#a6cfaf','#8ecdd1','#8eace0','#b3a0d9','#fff'];
function icon(name){const p={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/>',book:'<path d="M12 5C8 2 4 3 2 4v16c4-2 7-1 10 1m0-16c4-3 8-2 10-1v16c-4-2-7-1-10 1V5Z"/>',layers:'<path d="m12 3 10 5-10 5L2 8l10-5Zm-9 9 9 5 9-5M3 17l9 5 9-5"/>',chart:'<rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/>',pencil:'<path d="m4 15 12-12 5 5L9 20l-7 2 2-7ZM13 6l5 5"/>',folder:'<path d="M2 19V5a2 2 0 0 1 2-2h6l3 3h7a2 2 0 0 1 2 2v3H7l-5 10h16l4-10"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.layers}</svg>`}
const arrow='<svg class="chevron" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 3 6 7-6 7"/></svg>';
function button(text,action,cls='',data=''){return `<button class="btn ${cls}" data-action="${action}" ${data}>${text}</button>`}
function header(title,text){return `<header class="page-head"><h1>${title}</h1>${text?`<p>${text}</p>`:''}</header>`}
function mini(dim){const shapes={空间:'<path d="M10 28h20v20H10zm20-20h20v20H30zm20 20h20v20H50z" fill="#eeebfc" stroke="currentColor"/><path d="m10 28 9-8h20L30 28m0 0 9-8v20l-9 8m0-40 9-6h20l-9 6m0 0 9-6v20l-9 6" fill="none" stroke="currentColor"/>',观察:'<rect x="4" y="10" width="30" height="36" fill="none" stroke="currentColor"/><rect x="46" y="10" width="30" height="36" fill="none" stroke="currentColor"/><circle cx="19" cy="28" r="8" fill="currentColor"/><circle cx="61" cy="28" r="9" fill="currentColor"/>',逻辑:'<path d="m4 42 12-26 12 26Zm33-24h23v23H37Z" fill="none" stroke="currentColor"/><text x="66" y="39" font-size="24" fill="currentColor">?</text>',记忆:'<path d="M4 6h18v18H4Zm48 0h18v18H52ZM28 30h18v18H28Z" fill="currentColor"/><path d="M28 6h18v18H28ZM4 30h18v18H4Zm48 0h18v18H52Z" fill="none" stroke="currentColor"/>',计算:'<rect x="1" y="12" width="80" height="36" rx="6" stroke="#cdd0df" fill="none"/><text x="8" y="36" font-size="15" font-family="monospace" fill="#252535">386+247?</text>',规划:'<path d="M18 2h54v54H18ZM36 2v54M54 2v54M18 20h54M18 38h54" stroke="currentColor" fill="none"/><circle cx="27" cy="47" r="5" fill="currentColor"/><path d="m63 7 2 4 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1Z" fill="currentColor"/>'};return `<span class="mini" aria-hidden="true"><svg viewBox="0 0 84 58">${shapes[dim]}</svg></span>`}
function toast(text){let el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4500)}
function savedStatus(){let status=S.status();return `<span class="save-state ${status.ok?'':'failed'}">${esc(status.message)}${status.at?` · ${new Date(status.at).toLocaleTimeString('zh-CN',{hour12:false})}`:''}</span>`}
function updateStatus(){document.querySelectorAll('[data-save]').forEach(x=>x.innerHTML=savedStatus());let bar=document.getElementById('conflict');if(bar){bar.className=S.conflict()?'conflict':'hidden';bar.innerHTML=S.conflict()?'另一个页面更新了训练存档。请先导出本页副本，再重新载入。 '+button('导出本页副本','export')+' '+button('重新载入','reload'):''}}
S.subscribe(updateStatus);
function navigate(to){if(to!=='arena'&&S.get().arena.active)BrainArenaUI.interrupt();let current=S.get().current;if(to!=='session'&&current&&(current.mode==='assessment'||current.active?.phase==='memorize')){S.commit(s=>{let c=s.current;c.interrupted=true;for(let r of s.records)if(r.sessionId===c.id)r.interrupted=true;if(c.active){c.active.interrupted=true;if(c.active.phase==='memorize'){c.active.phase='answer';c.active.until=null}}})}route=to;location.hash=to;render();window.scrollTo(0,0)}
function resumeStrip(){const c=S.get().current;return c&&route!=='session'?`<div class="resume-strip"><span>未完成：${esc(c.label)} · 第 ${Math.min(c.index+1,c.queue.length)} / ${c.queue.length} 题${c.mode==='assessment'?' · 测评计时继续':''}</span>${button('继续练习','resume')}</div>`:''}
function render(){if(!navs.some(n=>n[0]===route)&&!['session','lesson','report'].includes(route))route='arena';let content=route==='arena'?BrainArenaUI.view():route==='home'?home():route==='learn'?learn():route==='lesson'?lesson():route==='bank'?bank():route==='test'?testPage():route==='wrong'?wrong():route==='archive'?archive():route==='session'?sessionView():report();root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">脑力研习室</div><nav class="nav" aria-label="主要导航">${navs.map(([key,label,ic])=>`<button data-nav="${key}" class="${route===key||route==='lesson'&&key==='learn'?'active':''}" ${route===key?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-foot">学习方法，练习执行。<br>3个同规模专项 · 36套整题<br>9种基础题型 · 1,080题<br>个人训练 · 非官方测评</div></aside><main class="main"><div id="conflict" class="hidden"></div>${route==='home'?'':resumeStrip()}${content}</main></div>`;updateStatus()}
function baselinePanel(){let s=S.get(),last=s.sessions.filter(x=>x.mode==='assessment'&&x.finished&&!x.interrupted).at(-1);if(last){let records=s.records.filter(r=>r.sessionId===last.id);return `<section class="panel baseline"><h2>最近六维测评</h2>${E.DIMS.map(dim=>{let total=last.queue.filter(qid=>E.question(qid).dim===dim).length,ok=records.filter(r=>E.question(r.qid).dim===dim&&r.ok).length;return `<div class="bar-row"><strong>${dim}</strong><div class="bar"><i style="width:${total?ok/total*100:0}%"></i></div><span>${ok}/${total}</span></div>`}).join('')}<div class="muted">${stamp(last.endedAt)}<br>显示完整答对题数；每维仅2题，不能作为智力分。</div></section>`}let refs=Object.entries(s.reference.scores);if(refs.length)return `<section class="panel baseline"><h2>导入的历史参考</h2>${refs.map(([dim,value])=>`<div class="bar-row"><strong>${dim}</strong><div class="bar"><i style="width:${value}%"></i></div><span>${value}</span></div>`).join('')}<div class="muted">${esc(s.reference.date)}<br>来自你手动导入的本机备份，不与新测评混合。</div></section>`;return `<section class="panel baseline"><h2>你的训练起点</h2><p>还没有测评记录。</p><p class="muted">先学习方法，完成几组练习，再做一次基础六维测评。这里会显示你自己的本机记录。</p>${button('去做基础测评','go-test')}<div class="muted">不会预置其他人的成绩。记录保存在本机浏览器。</div></section>`}
function home(){let s=S.get(),dims=[['空间','在脑中旋转图形，检查位置关系。'],['观察','比较细节差异，识别叠色规律。'],['逻辑','利用行列约束，规划公约数路径。'],['记忆','把颜色和位置绑定，按序回忆。'],['计算','先把心算做稳，再缩短用时。'],['规划','先预演空位路线，再推动滑块。']];let tasks=[['规划 · 先想三步再移动','建议 15 分钟 · 基础','slide'],['计算 · 稳住进位与借位','建议 10 分钟 · 基础','arithmetic'],['记忆 · 绑定颜色和位置','建议 5 分钟 · 基础','color']];return `<div class="dashboard"><div><header class="hero"><h1>把每一次练习，变成进步。</h1><p>先学方法，再做题；进度自动保存在这个浏览器。</p><div class="actions">${button('开始今日训练','today','primary')}<button class="btn" data-action="resume" ${s.current?'':'disabled'}>继续上次练习</button></div></header><section class="panel task-list"><h2>今日训练</h2>${tasks.map(([name,note,type],i)=>`<div class="task"><span class="number">${i+1}</span><div class="task-label"><h3>${name}</h3><span class="muted">${note}</span></div>${button('开始','start-type','primary',`data-type="${type}" data-level="1"`)}</div>`).join('')}</section><section class="topic-section"><h2>六维训练</h2><div class="topic-grid">${dims.map(([d,desc])=>`<button class="topic" data-action="open-dim" data-dim="${d}"><div class="topic-copy"><h3>${d}</h3><p>${desc}</p></div>${mini(d)}${arrow}</button>`).join('')}</div></section><p class="footnote">本页是新编基础热身题；完整任务请进入比赛专项。所有难度和训练目标均为本站设定。学习和训练记录仅在本机保存。</p></div><aside class="right-rail">${baselinePanel()}<section class="panel save-panel"><h2>训练存档</h2><div data-save>${savedStatus()}</div>${button('导出备份','export')}<div class="muted">换设备前，请先备份。<br>尚未提供云端同步。</div><p class="statusline">已提交 ${s.records.filter(x=>x.status==='submitted').length} 题 · 存档 ${s.sessions.length} 次训练</p></section></aside></div>`}
function learn(){let s=S.get(),done=Object.values(s.lessons).filter(x=>x.done).length;return `<div class="wide">${header('先学方法，再上题库。','每节课围绕一个可执行的方法：读懂规则、看示例、做一组练习、复盘错误。课程为本站新编内容。')}<div class="statusline">已完成 ${done} / 9 节方法课</div><div class="progress"><i style="width:${done/9*100}%"></i></div><div class="row-list">${E.TYPES.map((t,i)=>`<article class="list-row"><div class="numberline muted">${String(i+1).padStart(2,'0')}</div><div class="grow"><h3>${t.dim} · ${L[t.id].title}</h3><p class="muted">${t.lesson}${s.lessons[t.id]?.done?' · 已学完':''}</p></div>${button(s.lessons[t.id]?.done?'再次学习':'开始学习','lesson','',`data-type="${t.id}"`)}</article>`).join('')}</div></div>`}
function lesson(){let t=E.TYPES.find(x=>x.id===lessonId);if(!t){route='learn';return learn()}let l=L[t.id],saved=S.get().lessons[t.id];return `<div class="wide">${button('返回课程','learn-back','ghost')}${header(l.title,l.intro)}<div class="lesson-text">${l.steps.map((x,i)=>`<div class="step"><strong>0${i+1}</strong>${x}</div>`).join('')}<div class="callout"><h3>演示例题</h3><p>${l.example}</p></div><h3>常见错误</h3><p>${l.pitfall}</p><h3>怎么判断可以加难</h3><p>${l.goal}</p><p class="muted">与节目关系：${t.program}</p><label class="inline-label" for="lesson-note">学习笔记（自动保存）</label><textarea id="lesson-note" data-note="${t.id}" rows="4" placeholder="记下你的方法和容易错的地方">${esc(saved?.note||'')}</textarea><div class="actions section">${button(saved?.done?'已学完 · 再次登记':'标记本课已学完','lesson-done','',`data-type="${t.id}"`)}${button('去做5道基础练习','start-type','primary',`data-type="${t.id}" data-level="1"`)}</div><div data-save>${savedStatus()}</div></div></div>`}
function bank(){let filtered=E.TYPES.filter(t=>(bankDim==='全部'||t.dim===bankDim)&&(!search||[t.name,t.dim,t.desc].join('').includes(search)));let s=S.get(),first=firstRecords();let body=`<label class="inline-label" for="bank-search">搜索题型</label><input id="bank-search" placeholder="例如：滑块、记忆、公约数" value="${attr(search)}" style="width:320px"><div class="filters" aria-label="能力筛选">${['全部',...E.DIMS].map(d=>`<button class="chip ${d===bankDim?'selected':''}" data-action="bank-dim" data-dim="${d}">${d}</button>`).join('')}</div><div class="filters" aria-label="难度筛选">${E.LEVELS.map((l,i)=>`<button class="chip ${bankLevel===i+1?'selected':''}" data-action="bank-level" data-level="${i+1}">${l}</button>`).join('')}</div>`;
if(bankType){let t=E.TYPES.find(x=>x.id===bankType),qs=E.BANK.filter(id=>id.startsWith(`v1-${bankType}-${bankLevel}-`)),page=qs.slice(bankPage*10,bankPage*10+10);body+=`<div class="section">${button('返回题型列表','bank-back','ghost')}<h2>${t.dim} · ${t.name} · ${E.LEVELS[bankLevel-1]}</h2><p class="muted">${t.program} 每档40题，固定编号可重做。${bankType==='slide'?'基础最短6–8步；进阶12–14步；挑战为4×4浅层8–10步。':''}</p><div class="table-wrap"><table class="data-table"><thead><tr><th>题号</th><th>首次提交</th><th>复习状态</th><th>练习</th></tr></thead><tbody>${page.map(qid=>{let r=first.get(qid),rev=s.reviews[qid];return `<tr><td class="numberline">${qid}</td><td>${r?r.ok?'完整答对':`部分分 ${pct(r.part)}`:'未练'}</td><td>${rev?rev.streak?'待间隔巩固':'待纠正':'—'}</td><td>${button('做这道','single','',`data-qid="${qid}"`)}</td></tr>`}).join('')}</tbody></table></div><div class="pagination"><button class="btn" data-action="bank-prev" ${bankPage===0?'disabled':''}>上一页</button><span>${bankPage+1} / 4</span><button class="btn" data-action="bank-next" ${bankPage===3?'disabled':''}>下一页</button></div></div>`}
else body+=`<div class="row-list">${filtered.length?filtered.map(t=>{let qs=E.BANK.filter(id=>id.startsWith(`v1-${t.id}-${bankLevel}-`)),n=qs.filter(id=>first.has(id)).length;return `<article class="list-row"><div class="grow"><h3>${t.dim} · ${t.name}</h3><p class="muted">${t.desc}</p><div class="topic-count">${E.LEVELS[bankLevel-1]} · 40题 · 已首次提交 ${n} 题</div></div><div class="actions">${button('学习方法','lesson','ghost',`data-type="${t.id}"`)}${button('浏览题目','browse-type','',`data-type="${t.id}"`)}${button('练5题','start-type','primary',`data-type="${t.id}" data-level="${bankLevel}"`)}</div></article>`}).join(''):'<div class="empty">没有匹配题型，换一个关键词试试。</div>'}</div>`;return `<div class="wide">${header('分级题库','9种题型 × 3档 × 每档40题，共1,080道固定编号生成题。先做同档新题，再用原题纠错；随机选题优先避开已做题。')}${body}</div>`}
function testPage(){let sessions=S.get().sessions.filter(x=>x.mode==='assessment');return `<div class="wide">${header('用新题，测一次当前状态。','基础六维测评共12题，每维2题，整节限时18分钟；题型和时间为本站设定，没有官方常模，不用于判断参赛资格。')}<div class="callout"><p>测评中不显示答案，交卷后统一复盘。切到后台或恢复中断会被标记，不能与完整首次测评直接比较。计时在离开页面时继续。</p></div><div class="section"><h2>基础六维测评</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>能力</th><th>内容</th><th>题数</th></tr></thead><tbody>${E.DIMS.map(d=>`<tr><td>${d}</td><td>${E.TYPES.filter(x=>x.dim===d).map(x=>x.name).join(' / ')}</td><td>2</td></tr>`).join('')}</tbody></table></div><div class="actions section">${button('开始基础六维测评','assessment','primary')}${S.get().current?.mode==='assessment'?button('继续本次测评','resume'):''}</div></div><section><h2>测评记录</h2>${sessions.length?sessionRows(sessions):'<div class="empty"><h3>还没有新测评</h3><p>旧版六维成绩单独保留在今日训练页。</p></div>'}</section></div>`}
function wrong(){let now=Date.now(),s=S.get(),all=Object.entries(s.reviews),rows=all.filter(([qid,r])=>reviewFilter==='all'||r.dueAt<=now).sort((a,b)=>a[1].dueAt-b[1].dueAt);return `<div class="wide">${header('把错题，练成会的方法。','首次答错进入复习；重做答对后安排1天、3天、7天的间隔检查。同一天反复答对只计一次巩固。中断题不增加巩固次数。')}<div class="filters"><button class="chip ${reviewFilter==='due'?'selected':''}" data-action="review-filter" data-filter="due">到期 ${all.filter(x=>x[1].dueAt<=now).length}</button><button class="chip ${reviewFilter==='all'?'selected':''}" data-action="review-filter" data-filter="all">全部 ${all.length}</button></div>${rows.length?`<div class="actions section">${button('复习当前前5题','review-due','primary')}</div><div class="row-list">${rows.map(([qid,r])=>{let q=E.question(qid);return `<article class="list-row"><div class="grow"><div class="review-label">${r.streak?'已纠正 · 跨日巩固 '+r.streak+' 次':'待纠正'} · ${r.dueAt<=now?'已到期':'下次 '+stamp(r.dueAt)}</div><h3>${q.dim} · ${q.name} · ${E.LEVELS[q.level-1]}</h3><p class="muted">${qid} · 错因：${esc(r.reason)} · 记录 ${r.attempts} 次</p></div>${button('重做原题','review-one','',`data-qid="${qid}"`)}</article>`}).join('')}</div>`:'<div class="empty"><h3>当前没有到期错题</h3><p>继续做同档新题，检验方法是否能迁移。</p></div>'}</div>`}
function firstRecords(){let m=new Map;for(let r of S.get().records){if(r.mode!=='review'&&r.status==='submitted'&&!r.interrupted&&!m.has(r.qid))m.set(r.qid,r)}return m}
function median(a){if(!a.length)return 0;let s=a.slice().sort((a,b)=>a-b),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function sessionRows(rows){return `<div class="row-list">${rows.slice().reverse().slice(0,50).map(c=>{let records=S.get().records.filter(r=>r.sessionId===c.id),submitted=records.filter(r=>r.status==='submitted');return `<article class="list-row"><div class="grow"><h3>${esc(c.label)}${c.interrupted?' · 有中断':''}</h3><p class="muted">${stamp(c.endedAt)} · 已提交 ${submitted.length}/${c.queue.length} · 完整答对 ${submitted.filter(x=>x.ok).length} 题</p></div>${button('查看复盘','report','',`data-id="${c.id}"`)}</article>`}).join('')}</div>`}
function archive(){let s=S.get(),first=[...firstRecords().values()],submitted=s.records.filter(x=>x.status==='submitted'),review=submitted.filter(x=>x.mode==='review');let counts=E.DIMS.map(d=>{let a=first.filter(r=>E.question(r.qid).dim===d);return {d,a}});return `<div class="wide">${header('每一次练习，都有来处。','训练进度、课程笔记、逐题作答、错因和复习日期都保存在这个浏览器。手动备份可跨设备恢复，当前没有云端同步。')}<div data-save>${savedStatus()}</div><div class="smallstats"><div class="stat"><strong>${submitted.length}</strong><span>基础题累计提交（含重做）</span></div><div class="stat"><strong>${first.length}</strong><span>有效首次题目</span></div><div class="stat"><strong>${first.length?pct(first.filter(x=>x.ok).length/first.length):'—'}</strong><span>首次完整正确率</span></div><div class="stat"><strong>${review.length}</strong><span>错题重做次数</span></div></div><section class="panel"><h2>比赛专项档案</h2><p>已存档 ${s.arena.records.length} 场整题训练${s.arena.active?'，1场正在进行':''}。整题草稿、操作轨迹、罚时与提示均包含在下方完整备份中。</p><button class="btn primary" data-nav="arena">查看比赛专项与完整复盘</button></section><section class="panel"><h2>备份与恢复</h2><p class="muted">建议每次训练结束后导出。移动本地网页、换浏览器、清理缓存或打开无痕窗口，可能找不到原来的记录。</p><div class="actions">${button('导出完整存档 JSON','export','primary')}${button('显示备份文本','show-backup')}</div><div id="backup-text" class="hidden"><label class="inline-label" for="backup-raw">下载不方便时，全选复制保存</label><textarea id="backup-raw" readonly rows="6"></textarea></div><label class="inline-label" for="import-file">选择备份文件恢复（先预览，再确认覆盖）</label><input type="file" id="import-file" accept=".json,application/json"><details class="section"><summary>使用粘贴文本恢复</summary><textarea id="import-raw" rows="5" aria-label="粘贴存档文本"></textarea>${button('校验并预览恢复','prepare-import')}</details><p class="statusline" id="import-status" role="status"></p><p class="muted">仅接受本站完整存档格式。其他软件的备份请保留在原软件中，不会自动转换或上传。</p></section><section class="section"><h2>按能力查看首次表现</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>能力</th><th>首次题数</th><th>完整正确率</th><th>部分分均值</th><th>用时中位数</th></tr></thead><tbody>${counts.map(({d,a})=>`<tr><td>${d}</td><td>${a.length}</td><td>${a.length?pct(a.filter(x=>x.ok).length/a.length):'—'}</td><td>${a.length?pct(a.reduce((n,x)=>n+x.part,0)/a.length):'—'}</td><td>${a.length?sec(median(a.map(x=>x.elapsed))):'—'}</td></tr>`).join('')}</tbody></table></div><p class="footnote">排除重做、中断和未提交题。各能力的题型与难度不同，请再按同题型同档比较；不合成为智力总分。记忆用时含图案展示。</p></section><section class="section"><h2>按题型与难度</h2>${first.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>题型</th><th>难度</th><th>题数</th><th>完整正确率</th><th>用时中位数</th></tr></thead><tbody>${E.TYPES.flatMap(t=>[1,2,3].map(l=>{let a=first.filter(r=>E.parse(r.qid).type===t.id&&E.parse(r.qid).level===l);return a.length?`<tr><td>${t.name}</td><td>${E.LEVELS[l-1]}</td><td>${a.length}</td><td>${pct(a.filter(x=>x.ok).length/a.length)}</td><td>${sec(median(a.map(x=>x.elapsed)))}</td></tr>`:''})).join('')}</tbody></table></div>`:'<p class="muted">完成练习后显示同档比较。</p>'}</section><section class="section"><h2>训练记录</h2>${s.sessions.length?sessionRows(s.sessions):'<div class="empty">训练结束后会在这里存档。进行中的题目可通过“继续练习”找回。</div>'}</section><section class="section"><h2>题库与规则边界</h2><p class="muted">题库为本站新编生成题，算法版本v1。全部1,080题固定编号；不是1,080道官方真题。空间/记忆/心算等为基础练习，模九、拉丁方、公约数路径等为基础规则改编；比赛专项另含3类、36套同规模原创完整任务。已确认规则和未核实项见各专项说明。方法课不是官方训练教材，测评没有常模或参赛资格映射。</p></section></div>`}
function canStart(){if(S.get().arena.active){toast('请先结束比赛专项，再开始基础练习。');navigate('arena');return false}if(S.conflict()){toast('存档已被另一页面更新，请先导出再重新载入。');return false}if(S.get().current){toast('你有未完成训练。请继续，或先在练习页结束并存档。');navigate('session');return false}return true}
function begin(mode,label,queue){if(!canStart())return;let at=Date.now();S.commit(s=>{s.current={id:id(),mode,label,queue,index:0,startedAt:at,deadline:mode==='assessment'?at+18*60000:null,resultIds:[],active:null,interrupted:false}});ensureActive();navigate('session')}
function seenIds(){return S.get().records.filter(r=>r.status==='submitted').map(r=>r.qid)}
function select(type,level,count=5){return E.select({type,level,count,seen:seenIds()})}
function ensureActive(){let c=S.get().current;if(!c||c.active||c.index>=c.queue.length)return;let q=E.question(c.queue[c.index]);S.commit(s=>{s.current.active={answer:E.initial(q),phase:['color','digits'].includes(q.type)?'ready':'answer',until:null,startedAt:Date.now(),reason:'',interrupted:false}})}
function patchAnswer(fn,redraw=true){let ok=S.commit(s=>{if(s.current?.active&&s.current.active.phase!=='done')fn(s.current.active,s.current)});if(ok&&redraw)render()}
function attempted(a,q){return ['rotate','mod9','detail'].includes(q.type)?a!==null:['digits','arithmetic'].includes(q.type)?E.normalize(a)!=='' :q.type==='gcd'?a.length>0:q.type==='slide'?a.moves>0:a.some(x=>x!==0&&x!=='')}
function submit(status='submitted',auto=false){let c=S.get().current;if(!c||!c.active||c.active.phase==='done')return;let q=E.question(c.queue[c.index]),a=c.active;if(status==='submitted'&&!attempted(a.answer,q)&&!auto){toast('请先作答，或选择跳过这题。');return}let grade=status==='submitted'?E.grade(q,a.answer):{ok:false,part:0,detail:status==='timeout'?'时间到，未提交':'跳过'};let advance=c.mode==='assessment';S.commit(s=>{let c=s.current,a=c.active;let record={id:c.id+'-'+c.index,sessionId:c.id,qid:q.id,at:Date.now(),mode:c.mode,status,answer:a.answer,elapsed:Math.max(0,Date.now()-a.startedAt),reason:a.reason||'',interrupted:!!(a.interrupted||c.interrupted),...grade};S.addRecord(s,record);if(!c.resultIds.includes(record.id))c.resultIds.push(record.id);a.phase='done';if(advance){c.index++;c.active=null}});if(advance){if(S.get().current.index>=S.get().current.queue.length)finish(false);else{ensureActive();render()}}else render()}
function next(){let c=S.get().current;if(!c)return;S.commit(s=>{s.current.index++;s.current.active=null});if(S.get().current.index>=S.get().current.queue.length)finish(false);else{ensureActive();render();window.scrollTo(0,0)}}
function finish(timeout=false){let c=S.get().current;if(!c)return;let sessionId=c.id;if(c.mode==='assessment'){
 S.commit(s=>{let c=s.current;for(let i=c.index;i<c.queue.length;i++){let q=E.question(c.queue[i]),a=i===c.index?c.active:null,has=a&&attempted(a.answer,q)&&a.phase!=='ready'&&a.phase!=='memorize',status=has?'submitted':timeout?'timeout':'skipped',grade=has?E.grade(q,a.answer):{ok:false,part:0,detail:timeout?'时间到未答':'提前结束未答'},r={id:c.id+'-'+i,sessionId:c.id,qid:q.id,at:Date.now(),mode:c.mode,status,answer:a?.answer??E.initial(q),elapsed:a?Math.max(0,Date.now()-a.startedAt):0,reason:a?.reason||'',interrupted:!!(c.interrupted||a?.interrupted),...grade};S.addRecord(s,r);if(!c.resultIds.includes(r.id))c.resultIds.push(r.id)}})
 }else if(c.active&&c.active.phase!=='done'&&attempted(c.active.answer,E.question(c.queue[c.index]))){submit('submitted',true)}
 S.commit(s=>{let c=s.current;s.sessions.push({...c,active:null,endedAt:Date.now(),finished:c.index>=c.queue.length||(c.mode!=='assessment'&&c.index===c.queue.length-1&&c.active?.phase==='done')});s.current=null});reportId=sessionId;navigate('report');if(timeout)toast('时间到，本次作答已结算并存档。')}
function matrix(cells,n,{click='',selected=null,path=null,mod=false,color=false,small=false}={}){return `<div class="matrix" style="--n:${n}">${cells.map((v,i)=>{let active=click,style=color?`background:${COLORS[v]||COLORS[0]};`:mod?`background:${MOD[v]};color:${v===0?'white':'#252638'};`:'';let cls=`cell ${active?'interactive':''} ${!color&&!mod&&v===1&&!click?'on':''} ${selected===i?'selected':''} ${path?.includes(i)?'path':''}`;let order=path?.indexOf(i);let value=color?`${v}`:mod?`${v}`:v===0&&!click?'':v;return active?`<button class="${cls}" style="${style}" data-action="${click}" data-cell="${i}" ${color?'data-color-cell="'+i+'"':''} aria-label="第${Math.floor(i/n)+1}行第${i%n+1}列${color?'，颜色'+v:''}">${esc(value)}${order>=0?`<small class="path-order">第${order+1}步</small>`:''}</button>`:`<div class="${cls}" style="${style}">${small&&!mod?'':esc(value)}</div>`}).join('')}</div>`}
function questionBody(q,a,feedback=false){let disabled=feedback?'disabled':'';if(q.type==='rotate')return `<h3>原图</h3>${matrix(q.target,q.n,{small:true})}<div class="opts">${q.options.map((x,i)=>`<button class="option ${a.answer===i?'selected':''}" data-action="choose" data-value="${i}" aria-label="选项${'ABCD'[i]}" ${disabled}><span>${'ABCD'[i]}</span>${matrix(x,q.n,{small:true})}</button>`).join('')}</div>`;
if(q.type==='mod9')return `<p class="muted">黑0 · 红1 · 橙2 · 黄3 · 绿4 · 青5 · 蓝6 · 紫7 · 白8</p><div class="pair"><div><h3>拼片A</h3>${matrix(q.a,q.n,{mod:true})}</div><div><h3>叠色结果</h3>${matrix(q.sum,q.n,{mod:true})}</div></div><div class="opts">${q.options.map((x,i)=>`<button class="option ${a.answer===i?'selected':''}" data-action="choose" data-value="${i}" aria-label="选项${'ABCD'[i]}" ${disabled}><span>${'ABCD'[i]}</span>${matrix(x,q.n,{mod:true})}</button>`).join('')}</div>`;
if(q.type==='detail')return `<div class="pair"><div><h3>原图</h3>${matrix(q.target,q.n)}</div><div><h3>点击下图的不同格</h3>${matrix(q.other,q.n,{click:feedback?'':'detail-cell',selected:a.answer})}</div></div>`;
if(q.type==='latin')return `<div class="matrix" style="--n:${q.n}">${q.clues.map((v,i)=>v?`<div class="cell fixed">${v}</div>`:`<label class="cell"><input class="cellinput" data-latin="${i}" value="${attr(a.answer[i])}" inputmode="numeric" maxlength="2" aria-label="第${Math.floor(i/q.n)+1}行第${i%q.n+1}列" ${disabled}></label>`).join('')}</div>`;
if(q.type==='gcd')return `${matrix(q.values,q.n,{click:feedback?'':'path-cell',path:a.answer})}<p class="statusline">已连 ${a.answer.length}/${q.n*q.n} 格；点当前终点可退一步。</p>${feedback?'':button('清空路径','clear-path')}`;
if(q.type==='slide')return `<div class="matrix" style="--n:${q.n}">${a.answer.board.map((v,i)=>`<button class="cell ${v?'interactive':'fixed'}" data-action="slide-cell" data-cell="${i}" aria-label="${v?'移动'+v:'空位'}" ${!v||feedback?'disabled':''}>${v||''}</button>`).join('')}</div><p class="statusline">累计移动 ${a.answer.moves} 步。每次只移动一格，重置不清零步数。</p>${feedback?'':button('重置盘面','reset-slide')}`;
if(q.type==='arithmetic')return `<div class="calculation">${q.text} = ?</div><label class="inline-label" for="answer-field">你的答案</label><input id="answer-field" class="answer-field" data-answer type="text" inputmode="text" autocomplete="off" value="${attr(a.answer)}" ${disabled}>`;
if(['color','digits'].includes(q.type)){
 if(a.phase==='ready')return `<div class="callout"><p>准备好再开始。展示 ${q.seconds} 秒，到时自动遮住；展示期间切到后台会被标记为中断。</p>${button('开始记忆','memory-start','primary')}</div>`;
 if(a.phase==='memorize')return `<div class="statusline">还有 <strong data-memory-clock>${Math.max(0,Math.ceil((a.until-Date.now())/1000))}</strong> 秒，然后自动遮住。</div>${q.type==='color'?matrix(q.solution,q.n,{color:true}):`<div class="numbers" aria-label="待记忆数字串">${q.solution}</div>`}`;
 return q.type==='color'?`<div class="palette"><span>0 空</span><span>1 红</span><span>2 黄</span><span>3 蓝</span></div>${matrix(a.answer,q.n,{click:feedback?'':'color-cell',color:true})}<p class="muted">点击格子循环切色；聚焦格子后可按0–3直接设置。</p>`:`<label class="inline-label" for="answer-field">按原顺序输入（保留开头的0）</label><input id="answer-field" class="answer-field" data-answer inputmode="numeric" autocomplete="off" value="${attr(a.answer)}" ${disabled}>`;
}return ''}
function solutionView(q){if(q.type==='rotate'||q.type==='mod9')return `<p>正确选项：<strong>${'ABCD'[q.solution]}</strong></p>${matrix(q.options[q.solution],q.n,{mod:q.type==='mod9',small:q.type==='rotate'})}`;if(q.type==='detail')return `<p>第${Math.floor(q.solution/q.n)+1}行，第${q.solution%q.n+1}列。</p>`;if(q.type==='color')return matrix(q.solution,q.n,{color:true});if(q.type==='latin')return matrix(q.solution,q.n);if(q.type==='gcd')return `<p class="numberline">${q.solution.map(i=>`(${Math.floor(i/q.n)+1},${i%q.n+1})`).join(' → ')}</p>`;if(q.type==='slide')return `<p>最短 ${q.optimal} 步。你的移动轨迹按点击的方块记录在存档中。</p>${matrix(q.solution,q.n)}`;return `<p class="numberline">参考答案：<strong>${q.solution}</strong></p>`}
function feedbackView(q,r,editable=false){return `<section class="feedback ${r.ok?'':'bad'}"><h3>${r.status!=='submitted'?'本题未提交':r.ok?'完整答对':'还需要再练'}${r.status==='submitted'&&!r.ok&&r.part>0?` · 部分分 ${pct(r.part)}`:''}</h3><p>${esc(r.detail)}${r.detail?' · ':''}用时 ${sec(r.elapsed)}${r.interrupted?' · 有中断，不计有效首次基线':''}</p><div class="solution"><h3>答案与方法</h3>${solutionView(q)}<p>${q.explain}</p></div>${editable&&!r.ok&&r.status==='submitted'?`<label class="inline-label" for="error-reason">这次主要错在哪里？（保存到复习记录）</label><select id="error-reason" data-reason><option value="">请选择错因</option>${['进位或借位','颜色与位置混淆','读题或坐标','规划循环','操作失误','方法不熟','其他'].map(x=>`<option ${r.reason===x?'selected':''}>${x}</option>`).join('')}</select>`:''}</section>`}
function sessionView(){let c=S.get().current;if(!c)return `<div class="wide">${header('当前没有未完成训练','从今日训练或分级题库开始。')}${button('去题库','go-bank','primary')}</div>`;if(!c.active)ensureActive();c=S.get().current;let a=c.active,q=E.question(c.queue[c.index]),r=S.get().records.find(x=>x.id===c.id+'-'+c.index),isDone=a.phase==='done';return `<div class="q-layout"><header class="q-head"><div><h1>${esc(c.label)}</h1><div class="muted">第 ${c.index+1} / ${c.queue.length} 题 · ${q.dim} · ${E.LEVELS[q.level-1]} · ${q.id}</div></div><div class="clock" data-test-clock>${c.deadline?formatClock(c.deadline-Date.now()):''}</div></header><div class="progress"><i style="width:${c.index/c.queue.length*100}%"></i></div>${c.interrupted||a.interrupted?'<div class="callout warning">本次存在展示中断或恢复。作答仍保存，但不计入有效首次基线。</div>':''}<section class="question"><h2>${q.prompt}</h2><div class="q-description">${q.program}</div>${questionBody(q,a,isDone)}${isDone&&r?feedbackView(q,r,true):''}<div class="q-actions">${isDone?button(c.index+1===c.queue.length?'完成并存档':'下一题','next','primary'):a.phase==='answer'?button(c.mode==='assessment'?'提交，继续下一题':'提交答案','submit','primary'):''}${!isDone?button('跳过这题','skip'):''}${button('结束并存档','finish','end')}</div></section><div data-save>${savedStatus()}</div><p class="q-foot">当前输入、盘面和训练进度自动保存在本机。中途退出可继续；测评截止时间不会因刷新延后。记忆题在展示中断后不会重新展示答案。</p></div>`}
function report(){let c=S.get().sessions.find(x=>x.id===reportId)||S.get().sessions.at(-1);if(!c)return `<div class="wide">${header('还没有训练存档','先完成一组练习。')}${button('开始今日训练','today','primary')}</div>`;let all=S.get().records.filter(x=>x.sessionId===c.id),a=all.filter(x=>x.status==='submitted');return `<div class="wide">${header(esc(c.label)+' · 训练复盘',`${stamp(c.endedAt)} · ${c.finished?'整组已完成':'提前结束'}${c.interrupted?' · 有中断，仅供练习':''}`)}<div class="smallstats"><div class="stat"><strong>${a.length}/${c.queue.length}</strong><span>提交题数 / 计划题数</span></div><div class="stat"><strong>${a.filter(x=>x.ok).length}</strong><span>完整答对题数</span></div><div class="stat"><strong>${a.length?pct(a.reduce((v,r)=>v+r.part,0)/a.length):'—'}</strong><span>已提交题目部分分均值</span></div><div class="stat"><strong>${a.length?sec(median(a.map(x=>x.elapsed))):'—'}</strong><span>题目用时中位数</span></div></div><p class="muted">这些数字描述本次题组，不是智力分或节目资格线；重做题与首次题请在训练档案中分开比较。</p>${E.DIMS.map(d=>{let qs=c.queue.filter(qid=>E.question(qid).dim===d);if(!qs.length)return '';let rs=all.filter(r=>E.question(r.qid).dim===d),ok=rs.filter(x=>x.ok).length;return `<div class="meter-row"><strong>${d}</strong><div class="bar"><i style="width:${ok/qs.length*100}%"></i></div><span>${ok}/${qs.length} 全对</span></div>`}).join('')}<div class="actions section">${button('导出完整存档','export','primary')}${button('去错题复习','go-wrong')}${button('返回今日训练','go-home')}</div><h2>逐题复盘</h2>${all.map((r,i)=>{let q=E.question(r.qid);return `<details class="panel"><summary>${i+1}. ${q.dim} · ${q.name} · ${r.status==='submitted'?r.ok?'完整答对':'需复习':r.status==='timeout'?'时间到未答':'跳过'} · ${sec(r.elapsed)}</summary><p class="q-description">题号 ${q.id}</p><h3>你的作答</h3>${answerSummary(q,r.answer)}${feedbackView(q,r)}</details>`}).join('')}</div>`}
function answerSummary(q,a){if(q.type==='color')return matrix(a,q.n,{color:true});if(q.type==='latin')return matrix(q.clues.map((x,i)=>x||a[i]||'·'),q.n);if(q.type==='slide')return `${matrix(a.board,q.n)}<p>累计 ${a.moves} 步</p>`;if(q.type==='gcd')return `<p>${a.map(i=>`(${Math.floor(i/q.n)+1},${i%q.n+1})`).join(' → ')||'未连线'}</p>`;if(['rotate','mod9'].includes(q.type))return `<p>${a===null?'未选择':'选项 '+'ABCD'[a]}</p>`;if(q.type==='detail')return `<p>${a===null?'未选择':`第${Math.floor(a/q.n)+1}行第${a%q.n+1}列`}</p>`;return `<p class="numberline">${esc(a)||'空'}</p>`}
function formatClock(ms){let n=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function downloadBackup(){let text=S.exportText(),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='脑力研习室-完整存档-'+S.day(Date.now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('已生成完整存档，请确认下载文件已保存。')}
function prepareImport(text){try{prepared=S.prepareImport(text);let d=document.getElementById('restore-dialog');d.innerHTML=`<h2>恢复这个存档？</h2><p>包含 ${prepared.records.length} 条逐题记录、${prepared.sessions.length} 次基础训练、${prepared.arena.records.length} 场比赛专项、${Object.keys(prepared.lessons).length} 节课程笔记${prepared.current||prepared.arena.active?'，以及未完成训练草稿':''}。</p><p class="muted">恢复会替换当前浏览器中的本站存档。建议先下载当前副本。恢复中的测评会标记中断，原截止时间继续。</p><div class="actions">${button('先下载当前副本','export')}${button('取消','cancel-import')}${button('确认恢复并替换','apply-import','primary')}</div>`;d.showModal()}catch(e){toast('无法导入：'+e.message);let el=document.getElementById('import-status');if(el)el.textContent='无法导入：'+e.message}}
function action(el){let a=el.dataset.action,c=S.get().current;switch(a){
case'today':{let seen=seenIds(),queue=['slide','arithmetic','color'].flatMap(type=>E.select({type,level:1,count:5,seen}));begin('today','今日训练 · 规划、计算与位置记忆',queue);break}
case'resume':if(c){ensureActive();navigate('session')}else toast('没有未完成的训练。');break;
case'start-type':{let t=E.TYPES.find(x=>x.id===el.dataset.type),level=+el.dataset.level;begin('practice',`${t.dim} · ${t.name} · ${E.LEVELS[level-1]}`,select(t.id,level));break}
case'single':begin('practice','单题练习 · '+E.question(el.dataset.qid).name,[el.dataset.qid]);break;
case'open-dim':bankDim=el.dataset.dim;bankType=null;search='';navigate('bank');break;
case'lesson':lessonId=el.dataset.type;navigate('lesson');break;
case'learn-back':navigate('learn');break;
case'lesson-done':{let t=el.dataset.type;S.commit(s=>s.lessons[t]={done:true,note:s.lessons[t]?.note||'',updatedAt:Date.now()});render();toast('已记录课程进度。');break}
case'bank-dim':bankDim=el.dataset.dim;bankType=null;bankPage=0;render();break;
case'bank-level':bankLevel=+el.dataset.level;bankPage=0;render();break;
case'browse-type':bankType=el.dataset.type;bankPage=0;render();break;
case'bank-back':bankType=null;render();break;
case'bank-prev':bankPage=Math.max(0,bankPage-1);render();break;
case'bank-next':bankPage=Math.min(3,bankPage+1);render();break;
case'assessment':{let seen=seenIds(),queue=E.assessment(seen);begin('assessment','基础六维测评',queue);break}
case'review-filter':reviewFilter=el.dataset.filter;render();break;
case'review-one':begin('review','错题复习 · '+E.question(el.dataset.qid).name,[el.dataset.qid]);break;
case'review-due':{let rows=Object.entries(S.get().reviews).filter(([qid,r])=>reviewFilter==='all'||r.dueAt<=Date.now()).sort((a,b)=>a[1].dueAt-b[1].dueAt).slice(0,5).map(x=>x[0]);if(rows.length)begin('review','间隔复习',rows);break}
case'choose':if(c?.active.phase==='answer')patchAnswer(x=>x.answer=+el.dataset.value);break;
case'detail-cell':if(c?.active.phase==='answer')patchAnswer(x=>x.answer=+el.dataset.cell);break;
case'color-cell':if(c?.active.phase==='answer'){let i=+el.dataset.cell;patchAnswer(x=>x.answer[i]=(x.answer[i]+1)%4);document.querySelector(`[data-color-cell="${i}"]`)?.focus()}break;
case'path-cell':if(c?.active.phase==='answer'){let q=E.question(c.queue[c.index]),i=+el.dataset.cell,last=c.active.answer.at(-1);if(last===i){patchAnswer(x=>x.answer.pop())}else if(c.active.answer.includes(i)){toast('这个格子已经走过。')}else if(last===undefined||E.neighbors(last,q.n).includes(i)&&E.gcd(q.values[last],q.values[i])>1){patchAnswer(x=>x.answer.push(i))}else toast('只能走相邻且有大于1公约数的格子。')}break;
case'clear-path':patchAnswer(x=>x.answer=[]);break;
case'slide-cell':if(c?.active.phase==='answer'){let q=E.question(c.queue[c.index]),i=+el.dataset.cell,z=c.active.answer.board.indexOf(0);if(E.neighbors(z,q.n).includes(i)){patchAnswer(x=>{let v=x.answer.board[i];[x.answer.board[z],x.answer.board[i]]=[x.answer.board[i],0];x.answer.moves++;x.answer.trail.push(v)});document.querySelector(`[data-action="slide-cell"][data-cell="${z}"]`)?.focus()}else toast('只能移动空位相邻的块。')}break;
case'reset-slide':if(c?.active.phase==='answer'){let q=E.question(c.queue[c.index]);patchAnswer(x=>{x.answer.board=q.start.slice();x.answer.trail.push('reset')})}break;
case'memory-start':if(c?.active.phase==='ready'){let q=E.question(c.queue[c.index]);patchAnswer(x=>{x.phase='memorize';x.until=Date.now()+q.seconds*1000})}break;
case'submit':submit();break;
case'skip':submit('skipped');break;
case'next':next();break;
case'finish':finish();break;
case'go-bank':navigate('bank');break;case'go-test':navigate('test');break;
case'go-home':navigate('home');break;
case'go-wrong':navigate('wrong');break;
case'report':reportId=el.dataset.id;navigate('report');break;
case'export':downloadBackup();break;
case'show-backup':document.getElementById('backup-text').classList.remove('hidden');document.getElementById('backup-raw').value=S.exportText();break;
case'prepare-import':prepareImport(document.getElementById('import-raw').value);break;
case'cancel-import':document.getElementById('restore-dialog').close();prepared=null;break;
case'apply-import':if(prepared){S.applyImport(prepared);prepared=null;document.getElementById('restore-dialog').close();navigate('archive');toast('完整存档已恢复到本页，请查看保存状态。')}break;
case'reload':location.reload();break;
}}
document.addEventListener('click',ev=>{let nav=ev.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}let el=ev.target.closest('[data-action]');if(el&&!el.disabled){try{action(el)}catch(e){console.error(e);toast('操作未完成：'+e.message)}}});
document.addEventListener('input',ev=>{let el=ev.target;if(el.matches('[data-answer]')){let c=S.get().current;if(c?.active?.phase==='answer'){let q=E.question(c.queue[c.index]),value=el.value;if(q.type==='digits'){value=E.normalize(value).replace(/\D/g,'').slice(0,50);el.value=value}patchAnswer(a=>a.answer=value,false)}}else if(el.matches('[data-latin]')){let value=E.normalize(el.value).replace(/\D/g,'').slice(-2);el.value=value;patchAnswer(a=>a.answer[+el.dataset.latin]=value,false)}else if(el.matches('[data-note]')){let type=el.dataset.note;S.commit(s=>s.lessons[type]={done:!!s.lessons[type]?.done,note:el.value.slice(0,10000),updatedAt:Date.now()})}else if(el.id==='bank-search'){let pos=el.selectionStart;search=el.value;bankType=null;render();let x=document.getElementById('bank-search');x.focus();x.setSelectionRange(pos,pos)}});
document.addEventListener('change',async ev=>{let el=ev.target;if(el.id==='import-file'){try{let f=el.files[0];if(f){if(f.size>20000000)throw Error('文件超过20MB');prepareImport(await f.text())}}catch(e){toast('无法读取：'+e.message)}}else if(el.matches('[data-reason]')){let c=S.get().current;if(c?.active?.phase==='done'){S.commit(s=>{let record=s.records.find(x=>x.id===c.id+'-'+c.index);if(record){record.reason=el.value;if(s.reviews[record.qid])s.reviews[record.qid].reason=el.value}})}}});
document.addEventListener('keydown',ev=>{let c=S.get().current;if(ev.key==='Enter'&&ev.target.matches('[data-answer]')&&c?.active?.phase==='answer'){ev.preventDefault();submit()}if(/^[0-3]$/.test(ev.key)&&ev.target.matches('[data-color-cell]')&&c?.active?.phase==='answer'){ev.preventDefault();let i=+ev.target.dataset.colorCell;patchAnswer(a=>a.answer[i]=+ev.key);document.querySelector(`[data-color-cell="${i}"]`)?.focus()}});
window.addEventListener('hashchange',()=>{let next=location.hash.slice(1)||'arena';if(next!==route){if(next!=='arena'&&S.get().arena.active)BrainArenaUI.interrupt();route=next;render()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){let c=S.get().current;if(c&&(c.mode==='assessment'||c.active?.phase==='memorize')){S.commit(s=>{let c=s.current;c.interrupted=true;for(let r of s.records)if(r.sessionId===c.id)r.interrupted=true;if(c.active){c.active.interrupted=true;if(c.active.phase==='memorize'){c.active.phase='answer';c.active.until=null}}});render()}}});
// Recovery preserves drafts; a restored timed test or exposed memory task cannot be a fresh baseline.
if(S.get().current){S.commit(s=>{let c=s.current;if(c.mode==='assessment'){c.interrupted=true;for(let r of s.records)if(r.sessionId===c.id)r.interrupted=true;}if(c.active?.phase==='memorize'){c.active.phase='answer';c.active.until=null;c.active.interrupted=true;c.interrupted=true}})}
setInterval(()=>{let c=S.get().current;if(!c||S.conflict())return;if(c.deadline&&Date.now()>=c.deadline){finish(true);return}document.querySelectorAll('[data-test-clock]').forEach(x=>x.textContent=c.deadline?formatClock(c.deadline-Date.now()):'');if(c.active?.phase==='memorize'){if(Date.now()>=c.active.until){S.commit(s=>{s.current.active.phase='answer';s.current.active.until=null});if(route==='session')render()}else document.querySelectorAll('[data-memory-clock]').forEach(x=>x.textContent=Math.max(0,Math.ceil((c.active.until-Date.now())/1000)))}}
,250);
BrainArenaUI.init({store:S,navigate,render,toast,exportBackup:downloadBackup});
render();
})();
</script></body></html>
