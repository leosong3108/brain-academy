function hint(){let s=active();if(!s)return;let q=A.get(s.caseId),text;if(q.kind==='dragon'){text=BrainDragonUI.hint(q,s.answer)}else if(q.kind==='gcd'){let prefix=s.answer.path.every((v,i)=>v===q.solution[i]);text=s.answer.path.length===64?'已连满64格，请提交整题验证。':prefix?`示例路径的下一步是第${Math.floor(q.solution[s.answer.path.length]/8)+1}行第${q.solution[s.answer.path.length]%8+1}列。它只是一个可行解的接续，不是所有合法路径必须采用的下一步。`:'当前路径不沿示例路径前进。先考虑连接少的格和剩余区域是否被封闭；完整复盘中可看示例路线。'}else if(q.kind==='hid'){let i=q.clues.findIndex((v,i)=>!v&&+s.answer.cells[i]!==q.solution[i]);text=i>=0?`示例解第${Math.floor(i/9)+1}行第${i%9+1}列填${q.solution[i]}。`:'所有数字已经与示例解一致，请提交整题。'}else{let i=s.answer.placements.findIndex((p,i)=>!p||p.x!==q.parts[i].solution.x||p.y!==q.parts[i].solution.y),p=q.parts[Math.max(0,i)];text=i>=0?`拼片${i+1}的一个可行位置：左上角第${p.solution.y+1}行、第${p.solution.x+1}列。`:'所有拼片已与示例布局一致，请提交整题。'}C.store.commit(v=>{v.arena.active.hints++;v.arena.active.feedback='hint';v.arena.active.hintText=text});redraw()}
function source(qkind){let m=A.META[qkind];return `<details class="arena-source"><summary>规则依据、训练设定与未核实项</summary><p><strong>资料记载：</strong>${m.known}</p><p><strong>本版设定：</strong>${m.custom}</p><p><a href="${m.url}" target="_blank" rel="noreferrer">节目片段出处 · ${m.episode}</a>。出处来自用户提供的第十季笔记；本次未逐帧复核。题目为原创生成，未使用节目原题、图案或选手常模。</p><p>这版复现相同任务规模与列出的核心规则；完整节目等效难度、干扰分布与选手竞争力尚未得到验证。用实际完成、用时与复盘来评估训练，不设“脑王线”。</p></details>`}
function configure(id,selectedMode='learn',selectedLimit=0){if(!A.META[id])return;kind=id;mode=selectedMode;limit=selectedLimit;caseId=A.CASES.find(q=>q.kind===id&&!(state().seen||[]).includes(q.id)&&!state().records.some(r=>r.caseId===q.id))?.id||null;reportId=null;replayAt=null}
function landing(){let m=A.META[kind],cases=A.CASES.filter(q=>q.kind===kind).sort((a,b)=>a.id.localeCompare(b.id));if(!caseId||A.get(caseId).kind!==kind)caseId=cases[0].id;let q=A.get(caseId);return `<div class="wide arena-landing"><header class="page-head"><h1>完整专项训练</h1><p>选一个专项，按学过的规则独立完成整题。还不清楚怎么玩，先看例子再开题。</p></header><p><button class="btn" data-nav="guide">查看全部35项目、教程与分解练习</button></p><div class="filters" aria-label="比赛专项">${Object.entries(A.META).map(([id,x])=>`<button class="chip ${kind===id?'selected':''}" data-arena="kind" data-kind="${id}">${x.name}</button>`).join('')}</div><section class="panel arena-intro"><h2>${m.name}</h2><p class="arena-scale">${m.subtitle}</p><div class="arena-facts"><span>12道原创完整题</span><span>${kind==='dragon'?'30候选 · 27块 · 六面精确验图':kind==='hid'?'每题21提示 · 四邻接唯一解':kind==='gcd'?'每题均有可行全路径':'每题均有12片可行布局'}</span><span>难度尚无选手常模</span></div>${kind==='dragon'?'<div class="callout"><strong>觉得这页太难？先从零学起。</strong><p>10档小目标，每关都有例子、提示，独立通过后升档。完整题开题前会检查学习关是否通过。</p><button class="btn primary" data-nav="dragonpath">从第1档开始／继续学习</button></div>':buttonLesson(kind)}<div class="arena-config"><label>训练方式<select id="arena-mode"><option value="race" ${mode==='race'?'selected':''}>模拟竞速（隐藏错处）</option><option value="learn" ${mode==='learn'?'selected':''}>自由练习（可使用提示）</option></select></label><label>本站训练时限<select id="arena-limit">${[[0,'不限时'],[360,'6分钟（本站冲刺）'],[600,'10分钟'],[1200,'20分钟'],[1800,'30分钟'],[3600,'60分钟']].map(([n,label])=>`<option value="${n}" ${(limit===null?m.limit:limit)===n?'selected':''}>${label}</option>`).join('')}</select></label><label>固定题号<select id="arena-case">${cases.map(q=>`<option ${caseId===q.id?'selected':''}>${q.id}</option>`).join('')}</select></label></div><div class="actions">${btn('开始这道整题','start','primary')}${btn('选未做过的新题','fresh')}</div><p class="footnote">首次竞速记录需：首次做本题、模拟竞速、无提示、无切后台或刷新恢复，并在所选训练时限内完成。不限时也可训练，计时会持续记录。答题前读方法不扣分。</p></section><details class="arena-source"><summary>开题前回顾方法</summary><ol class="arena-method">${m.method.map(x=>`<li>${x}</li>`).join('')}</ol></details>${source(kind)}<p class="footnote">完成后的草稿、操作回放与复盘笔记，可到“我的档案 → 专项记录”查看。</p></div>`}
function buttonLesson(id){let c=BrainAcademy.COURSES[id];return `<div class="arena-plain-rules"><h3>整题目标</h3><p>${c.goal}</p><p>${c.controls.replace('检查答案','提交整题')}</p><button class="btn" data-academy="course" data-kind="${id}">看规则与一步步例子</button></div>`}
function numberBoard(q,a,review=false,truth=false){let n=q.n,values=q.kind==='gcd'?q.values:truth?q.solution:a.cells,order=q.kind==='gcd'?(truth?q.solution:a.path):[];return `<div class="arena-scroll" data-arena-scroll="number"><div class="arena-number-board" style="--n:${n}">${values.map((value,i)=>{let row=Math.floor(i/n)+1,col=i%n+1;if(q.kind==='gcd'){let k=order.indexOf(i);return `<button class="arena-cell ${k>=0?'taken':''}" data-arena="path" data-cell="${i}" data-arena-cell="${i}" aria-label="第${row}行第${col}列，数字${value}" ${review?'disabled':''}><strong>${value}</strong><small>${k>=0?k+1:`${row},${col}`}</small></button>`}let fixed=q.clues[i],wrong=review&&!truth&&+value!==q.solution[i];return fixed?`<div class="arena-cell fixed"><strong>${fixed}</strong><small>${row},${col}</small></div>`:review?`<div class="arena-cell ${wrong?'wrong-cell':''}"><strong>${esc(value)||'·'}</strong><small>${wrong?'应为'+q.solution[i]:row+','+col}</small></div>`:`<label class="arena-cell"><input inputmode="numeric" autocomplete="off" maxlength="2" data-arena-input="${i}" aria-label="第${row}行第${col}列" value="${esc(value)}"></label>`}).join('')}</div></div>`}
function colorCell(v){return `background:${colors[v]};color:${v===0?'#fff':'#202431'};`}
function pixelBoard(q,a,target=false,difference=false){let board=target?q.target:A.composite(q,a),p=a.placements[a.selected],piece=q.parts[a.selected];return `<div class="arena-scroll pixel-scroll" data-arena-scroll="${target?'target':'work'}"><div class="arena-pixels" style="--pixelsize:${22*zoom}px">${board.map((v,i)=>{let x=i%20,y=Math.floor(i/20),foot=!target&&p&&x>=p.x&&x<p.x+piece.w&&y>=p.y&&y<p.y+piece.h,wrong=difference&&!target&&v!==q.target[i],cls=`pixel ${foot?'footprint':''} ${wrong?'pixel-wrong':''}`,inside=`<span>${v}</span>`;return target||difference?`<div class="${cls}" style="${colorCell(v)}">${inside}</div>`:`<button class="${cls}" style="${colorCell(v)}" data-arena="place-cell" data-cell="${i}" aria-label="在第${y+1}行第${x+1}列放选中拼片">${inside}</button>`}).join('')}</div></div>`}
function parts(q,a,review=false){return `<div class="arena-piece-bank">${q.parts.map((p,i)=>`<button class="arena-piece ${a.selected===i?'selected':''}" data-arena="piece" data-piece="${i}" ${review?'disabled':''}><strong>拼片 ${i+1}${a.placements[i]?' · 已放':''}</strong><span class="mini-pixels" style="grid-template-columns:repeat(${p.w},1fr);aspect-ratio:${p.w}/${p.h}">${p.cells.map(v=>`<i style="background:${v?colors[v]:'transparent'}"></i>`).join('')}</span><small>${p.w}×${p.h}${a.placements[i]?` · (${a.placements[i].y+1},${a.placements[i].x+1})`:''}</small></button>`).join('')}</div>`}
function pixelWorkspace(q,a,review=false){let p=a.placements[a.selected],piece=q.parts[a.selected];return `<div class="arena-zoom"><span>颜色编号：黑0 红1 橙2 黄3 绿4 青5 蓝6 紫7 白8</span><label>显示倍率<select id="arena-zoom">${[1,2,3].map(x=>`<option ${zoom===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="arena-pixel-pair"><section><h3>目标图 · 20×20</h3>${pixelBoard(q,a,true)}</section><section><h3>${review?'你的最终布局':'你的叠色工作区'}</h3>${pixelBoard(q,a,false,review)}</section></div>${review?'':`<div class="arena-place-tools"><strong>选中拼片 ${a.selected+1} · ${piece.w}×${piece.h}</strong><label>左上行<input id="arena-row" type="number" min="1" max="${21-piece.h}" value="${p?p.y+1:1}" aria-label="左上行"></label><label>左上列<input id="arena-col" type="number" min="1" max="${21-piece.w}" value="${p?p.x+1:1}" aria-label="左上列"></label>${btn('放到坐标','place','primary')}${btn('上','up')}${btn('下','down')}${btn('左','left')}${btn('右','right')}${btn('取下本片','remove')}</div><p class="muted">先选拼片，再点工作区中的左上角，或输入坐标。箭头按钮/键盘方向键每次移动一格。透明孔按0参与叠加；超出边界不会放置。手机可用2倍视图并在盘内滚动。</p>`}${parts(q,a,review)}`}
function workspace(q,a,review=false,truth=false){if(q.kind==='dragon')return BrainDragonUI.workspace(q,a,{editable:!review,review});return q.kind==='pixel'?pixelWorkspace(q,a,review):numberBoard(q,a,review,truth)}
function activeView(s){let q=A.get(s.caseId),m=A.META[q.kind],g=A.grade(q,s.answer);return `<div class="arena-active"><header class="arena-head"><div><h1>${m.name} · ${s.mode==='race'?'模拟竞速':'自由练习'}</h1><p>${m.subtitle} · ${q.id}</p></div><div class="arena-clockbox"><strong data-arena-clock>${s.limitSec?clock(s.limitSec*1000-A.duration(s).total):clock(A.duration(s).total)}</strong><span>${s.limitSec?'剩余训练时间':'有效用时'}</span><small data-arena-time></small></div></header><div class="arena-session-note"><span data-arena-progress>${q.kind==='dragon'?`已放${g.filled}/${q.count}块`:q.kind==='pixel'?`已放${g.filled}/12片`:g.detail}</span><span>提交 ${s.submissions.length} 次 · 提示 ${s.hints} 次 · 中断 ${s.interruptions} 次${s.seenBefore?' · 已练习过本题':''}</span></div>${s.interruptions?'<div class="callout warning">本次存在切后台、刷新或恢复，继续保留草稿和原截止时间；记录作为练习，不列入有效首次竞速。</div>':''}${s.feedback==='wrong'?`<div class="callout error" role="status">本次提交未通过。${m.penalty?`罚时累计增加${m.penalty}秒。`:''}${s.mode==='race'?'竞速中不指出错处，结束后统一复盘。':` ${esc(g.detail)}；可用一步提示继续学习。`}</div>`:s.feedback==='hint'?`<div class="callout warning" role="status">${esc(s.hintText)} 本次已记辅助，不列入有效首次竞速。</div>`:''}<details class="arena-operation-help"><summary>这题怎么玩？查看目标与操作</summary><p>${BrainAcademy.COURSES[q.kind].goal}</p><p>${BrainAcademy.COURSES[q.kind].controls.replace('检查答案','提交整题')}</p><p>提交条件：${BrainAcademy.COURSES[q.kind].finish}</p><p>完整规则和逐步例子在“开始学习”中。计时期间离开页面会标记中断。</p></details><div class="arena-top-actions">${btn('提交整题','submit','primary')}${btn('撤回一步','undo')}${btn('重置整题','reset')}${btn('提示一步（记辅助）','hint')}${btn('结束并复盘','giveup')}${btn('导出完整存档','export')}</div><div class="arena-task">${workspace(q,s.answer)}</div>${source(q.kind)}<p class="footnote">草稿、移动轨迹、提交与罚时实时本机保存。有效用时=实际经过时间+罚时。限时包含罚时；切换页面不暂停。未完成不是“能力0分”，本版不计算跨项目智力总分。</p></div>`}
function recordLabel(s){let reasons=[];if(s.mode==='learn')reasons.push('自由练习');if(s.status!=='completed')reasons.push(s.status==='timeout'?'时限到未完成':'提前结束');if(s.seenBefore)reasons.push('已见题复练');if(s.hints)reasons.push('用过提示');if(s.interruptions)reasons.push('有中断');return reasons.join(' · ')||'未满足所选时限'}
function history(){let records=state().records;return `<section class="section"><h2>专项记录</h2>${records.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>题号</th><th>状态</th><th>实际+罚时</th><th>记录性质</th><th>复盘</th></tr></thead><tbody>${records.slice().reverse().slice(0,100).map(s=>{let r=A.result(s);return `<tr><td>${s.caseId}</td><td>${s.status==='completed'?'完成':s.status==='timeout'?'时限到未完成':'提前结束'}</td><td>${clock(r.raw)} + ${s.penaltySec}秒</td><td>${r.eligible?'有效首次竞速':recordLabel(s)}</td><td>${btn('完整复盘','report','',`data-id="${s.id}"`)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">完成或结束一场专项后，这里保存整题草稿和操作轨迹。基础题库的记录仍保留在原训练档案中。</div>'}</section>`}
function report(){let s=state().records.find(x=>x.id===reportId);if(!s){reportId=null;return landing()}let q=A.get(s.caseId),m=A.META[q.kind],r=A.result(s),frame=replayAt===null?s.events.length:replayAt,a=frame===s.events.length?s.answer:A.replay(q,s.events,frame);return `<div class="arena-report">${btn('返回专项选题','back','ghost')}<h1>${m.name} · 整题复盘</h1><p>${q.id} · ${stamp(s.endedAt)} · ${s.status==='completed'?'已完成':s.status==='timeout'?'超时未完成':'提前结束'}</p><div class="smallstats"><div class="stat"><strong>${clock(r.total)}</strong><span>有效用时（实际+罚时）</span></div><div class="stat"><strong>${s.penaltySec}秒</strong><span>罚时</span></div><div class="stat"><strong>${s.submissions.length}</strong><span>提交次数</span></div><div class="stat"><strong>${s.hints} / ${s.interruptions}</strong><span>提示 / 中断</span></div></div><div class="callout ${r.eligible?'good':'warning'}">${r.eligible?'有效首次竞速：本题首次、无辅助、无中断，并在本站所选时限内完成。':recordLabel(s)+'。保留本次用时和作答，不计为有效首次竞速。'} ${esc(r.detail).replace(/[。.]$/,'')}。不是节目资格线或官方排名。</div><div class="actions">${btn('重做同题（练习）','redo')}${s.status!=='completed'?btn('接续草稿（练习）','continue-draft'):''}${btn('导出完整存档','export')}</div><section class="section"><h2>复盘笔记</h2><label class="inline-label" for="arena-note">卡在哪里、错因与下次策略（自动保存）</label><textarea id="arena-note" data-arena-note="${s.id}" rows="3" placeholder="${q.kind==='dragon'?'例如：把小块自身方向当成了全局方向；下次先核对尾块朝向和二维码非对称碎片。':'记录卡点、错因，以及下次会怎样改进。'}">${esc(s.note||'')}</textarea></section><section class="section"><h2>操作轨迹回放</h2><label class="inline-label" for="arena-replay">步骤 ${frame} / ${s.events.length}（包括撤回与重置）</label><input type="range" id="arena-replay" min="0" max="${s.events.length}" value="${frame}" style="width:100%"><p class="muted">${frame?esc(describe(s.events[frame-1])):'初始题面'}</p>${workspace(q,a,true)}</section><details class="panel"><summary>查看示例解与方法（已结束，允许揭示）</summary><p>${m.method.join(' ')}</p>${q.kind==='dragon'?`<p>下面是一种可行折法；其他满足形状和六面纹样的折法也接受。</p>${BrainDragonUI.workspace(q,BrainDragon.solutionAnswer(q),{review:true})}`:q.kind==='pixel'?`<p>可行布局：${q.parts.map((p,i)=>`拼片${i+1} → (${p.solution.y+1},${p.solution.x+1})`).join('；')}。不要求和此布局相同，只要12片叠出目标都算完成。</p>${pixelWorkspace(q,A.solutionAnswer(q),true)}`:q.kind==='hid'?`<p>四邻接唯一解；错误格在上方终局标明。</p>${numberBoard(q,A.solutionAnswer(q),true,true)}`:`<p>下图为一条可行路径，格内小数字为顺序。其他满足规则的全路径也接受。</p>${numberBoard(q,A.solutionAnswer(q),true,true)}`}</details>${source(q.kind)}</div>`}

function worked(q,step){if(step===0)return P.initial(q);if(step===2)return clone(q.solution);if(q.ops?.length){try{return P.replay(q,q.ops.slice(0,Math.max(1,q.ops.length/2|0)))}catch{}}let a=P.initial(q);for(let k of Object.keys(a)){let v=q.solution[k];if(Array.isArray(v)){if(k==='placements')a[k]=v.map((x,i)=>i%2?null:clone(x));else if(['cells','values'].includes(k))a[k]=v.map((x,i)=>i%2?a[k][i]:x);else if(k==='selected')a[k]=v.slice(0,1);else if(k==='path')a[k]=v.slice(0,Math.max(1,v.length/2|0));else a[k]=clone(v)}else a[k]=v}if(!P.validAnswer(q,a))a=clone(q.solution);return a}

feedback ${feedback.ok?'correct':''}" role="status">${esc(feedback.detail)}</div>`:''}${R.render(q,l.answer,{tool,learn:true})}<div class="lesson-actions">${button('撤回一步','undo')}${button('重新做','reset')}${button('提示一步','hint')}${button('检查答案','check','primary')}${l.done?button('进入选题','stage','primary','data-stage="3"'):''}</div>`:`<h2>${l.done?'入门通过，接下来换新题':'选择正式新题'}</h2>${!l.done?'<p class="muted">建议先完成上面的教程跟练；也可以直接挑战。</p>':''}<p>每项有40道固定编号的生成练习。先独立完成，再选竞速。使用提示和复练都会保留，但不计首次独立完成。</p>${selector(id)}`}<details class="lesson-details"><summary>节目笔记与本站训练范围</summary><p><strong>笔记原规则：</strong>${esc(p.sourceRule)}</p><p><strong>本版：</strong>${p.boundary}</p><p>原计分记载：${p.sourceScoring}。本站分解题按页面显示的完成条件判定，不等同节目资格。</p></details><footer class="academy-save">教程位置、跟练草稿和通过记录自动保存在本机。</footer></div>`}

function exposure(s,q){if(s.phase==='ready')return `<section class="callout"><h2>准备好再观察</h2><p>本题会展示记忆资料，之后遮住。${q.exposure.manual?'可自行提前结束；节目笔记的观察时长是40分钟。':`共${q.exposure.frames}组，每组${q.exposure.interval/1000}秒。`}切后台或刷新会结束展示并标记中断。</p>${button('开始观察','observe','primary')}</section>`;let elapsed=Date.now()-s.exposureAt,frame=Math.min(q.exposure.frames-1,elapsed/q.exposure.interval|0);return `<section class="project-exposure"><p>第${frame+1}/${q.exposure.frames}组 · <span data-project-exposure-clock>${clock(q.exposure.frames*q.exposure.interval-elapsed)}</span></p>${R.render(q,s.answer,{show:true,frame,ro:true})}${button('提前结束观察并作答','hide')}</section>`}

function report(){let s=state().records.find(r=>r.id===reportId);if(!s)return history();let q=P.get(s.qid),p=P.CATALOG.find(p=>p.id===q.project),frame=replayAt??s.ops.length,a=P.replay(q,s.ops,frame),g=P.grade(q,s.answer),eligible=s.status==='completed'&&!s.hints&&!s.interruptions&&!s.seen&&s.mode==='race';return `<div class="project-report"><button class="btn" data-nav="archive">返回我的档案</button><h1>${p.name} · 项目复盘</h1><p>${s.qid} · ${s.status==='completed'?'完成':s.status==='timeout'?'时限到':'提前结束'} · ${clock(s.endedAt-s.startedAt+s.penalty*1000)}</p><div class="callout ${eligible?'good':'warning'}">${eligible?'本站有效首次独立竞速':'练习/复练/辅助/中断或未完成'}；${esc(g.detail)}。不映射官方参赛能力。</div><label class="inline-label">错因与下次策略<textarea id="project-note" data-record="${s.id}" rows="3">${esc(s.note||'')}</textarea></label><h2>操作回放</h2><label for="project-replay">步骤${frame}/${s.ops.length}</label><input id="project-replay" type="range" min="0" max="${s.ops.length}" value="${frame}" style="width:100%">${R.render(q,a,{ro:true,learn:true})}<details class="panel"><summary>查看一份参考结果与训练资料</summary>${R.render(q,q.solution,{ro:true,learn:true})}${q.exposure?`<div class="project-study-frames">${Array.from({length:q.exposure.frames},(_,i)=>`<section><h4>观察资料第${i+1}组</h4>${R.memory(q,q.solution,i,true)}</section>`).join('')}</div>`:''}<p>参考结果不是唯一强制答案；判分按页面规则接受合法替代解。</p></details><div class="actions">${button('选下一道新题','select','primary',`data-id="${q.project}"`)}${button('导出完整存档','export')}</div></div>`}
function op(operation){if(C.store.conflict())return C.toast('另一页面更新了存档，请先导出再刷新。');let active=state().active,q=active?P.get(active.qid):P.make(state().selected,0,true);if(active&&active.phase!=='answer')return;try{if(operation.type==='lamp')operation={type:'select',cell:operation.layer*q.n*q.n+operation.cell};if(active){let ops=active.ops.concat(operation),answer=P.replay(q,ops);C.store.commit(s=>{s.projectLab.active.ops=ops;s.projectLab.active.answer=answer})}else{let id=state().selected,l=lessonState(id),answer=operation.type==='undo'?(l.trail.at(-1)||l.answer):P.apply(q,l.answer,operation);saveLesson(id,l=>{if(operation.type==='undo')l.trail.pop();else{l.trail.push(l.answer);if(l.trail.length>500)l.trail.shift()}l.answer=answer})}feedback=null;redraw()}catch(e){feedback={ok:false,detail:e.message};redraw()}}

function mini(dim){const shapes={空间:'<path d="M10 28h20v20H10zm20-20h20v20H30zm20 20h20v20H50z" fill="#eeebfc" stroke="currentColor"/><path d="m10 28 9-8h20L30 28m0 0 9-8v20l-9 8m0-40 9-6h20l-9 6m0 0 9-6v20l-9 6" fill="none" stroke="currentColor"/>',观察:'<rect x="4" y="10" width="30" height="36" fill="none" stroke="currentColor"/><rect x="46" y="10" width="30" height="36" fill="none" stroke="currentColor"/><circle cx="19" cy="28" r="8" fill="currentColor"/><circle cx="61" cy="28" r="9" fill="currentColor"/>',逻辑:'<path d="m4 42 12-26 12 26Zm33-24h23v23H37Z" fill="none" stroke="currentColor"/><text x="66" y="39" font-size="24" fill="currentColor">?</text>',记忆:'<path d="M4 6h18v18H4Zm48 0h18v18H52ZM28 30h18v18H28Z" fill="currentColor"/><path d="M28 6h18v18H28ZM4 30h18v18H4Zm48 0h18v18H52Z" fill="none" stroke="currentColor"/>',计算:'<rect x="1" y="12" width="80" height="36" rx="6" stroke="#cdd0df" fill="none"/><text x="8" y="36" font-size="15" font-family="monospace" fill="#252535">386+247?</text>',规划:'<path d="M18 2h54v54H18ZM36 2v54M54 2v54M18 20h54M18 38h54" stroke="currentColor" fill="none"/><circle cx="27" cy="47" r="5" fill="currentColor"/><path d="m63 7 2 4 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1Z" fill="currentColor"/>'};return `<span class="mini" aria-hidden="true"><svg viewBox="0 0 84 58">${shapes[dim]}</svg></span>`}
function toast(text){let el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4500)}
function savedStatus(){let status=S.status();return `<span class="save-state ${status.ok?'':'failed'}">${esc(status.message)}${status.at?` · ${new Date(status.at).toLocaleTimeString('zh-CN',{hour12:false})}`:''}</span>`}
function updateStatus(){document.querySelectorAll('[data-save]').forEach(x=>x.innerHTML=savedStatus());let bar=document.getElementById('conflict');if(bar){bar.className=S.conflict()?'conflict':'hidden';bar.innerHTML=S.conflict()?'另一个页面更新了训练存档。请先导出本页副本，再重新载入。 '+button('导出本页副本','export')+' '+button('重新载入','reload'):''}}
S.subscribe(updateStatus);
function resolveCourseRoute(to){if(to!=='curriculum')CurriculumUI.interrupt();if(to==='classroom'&&S.get().academy.selected!=='dragon'){S.commit(s=>s.curriculum.selected=s.academy.selected);return 'curriculum'}if(to==='projectlesson'&&!S.get().curriculum.courses[S.get().projectLab.selected]?.levels.every(l=>l.passed)){S.commit(s=>s.curriculum.selected=s.projectLab.selected);return 'curriculum'}let project=/^learn-project-([a-z0-9]+)$/.exec(to);if(project&&Curriculum.IDS.includes(project[1])){S.commit(s=>s.curriculum.selected=project[1]);return 'curriculum'}let match=/^course-(gcd|hid|pixel|dragon)$/.exec(to);if(match){if(S.get().academy.selected!==match[1])S.commit(s=>s.academy.selected=match[1]);if(match[1]!=='dragon'){S.commit(s=>s.curriculum.selected=match[1]);return 'curriculum'}return 'dragonpath'}return to}
function navigate(to){if(to!=='curriculum')CurriculumUI.interrupt();if(to!=='lab'&&S.get().projectLab.active)ProjectUI.interrupt();if(to!=='arena'&&S.get().arena.active)BrainArenaUI.interrupt();let current=S.get().current;if(to!=='session'&&current&&(current.mode==='assessment'||current.active?.phase==='memorize')){S.commit(s=>{let c=s.current;c.interrupted=true;for(let r of s.records)if(r.sessionId===c.id)r.interrupted=true;if(c.active){c.active.interrupted=true;if(c.active.phase==='memorize'){c.active.phase='answer';c.active.until=null}}})}route=to;location.hash=to;render();window.scrollTo(0,0)}
function resumeStrip(){const c=S.get().current;return c&&route!=='session'?`<div class="resume-strip"><span>未完成：${esc(c.label)} · 第 ${Math.min(c.index+1,c.queue.length)} / ${c.queue.length} 题${c.mode==='assessment'?' · 测评计时继续':''}</span>${button('继续练习','resume')}</div>`:''}
function render(){if(!navs.some(n=>n[0]===route)&&!['session','lesson','report','classroom','learn','bank','test','wrong','projectlesson','projectreport','lab','dragonpath','curriculum'].includes(route))route='guide';let content=route==='guide'?ProjectUI.catalog():route==='curriculum'?CurriculumUI.view():route==='dragonpath'?DragonPathUI.view():route==='projectlesson'?ProjectUI.lesson():route==='projectreport'?ProjectUI.report():route==='lab'?ProjectUI.session():route==='classroom'?(S.get().academy.selected==='dragon'?DragonPathUI.view():CurriculumUI.view()):route==='basics'?basics():route==='arena'?BrainArenaUI.view():route==='learn'?learn():route==='lesson'?lesson():route==='bank'?bank():route==='test'?testPage():route==='wrong'?wrong():route==='archive'?BrainAcademyUI.archive():route==='session'?sessionView():report();root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">脑力研习室</div><nav class="nav" aria-label="主要导航">${navs.map(([key,label,ic])=>`<button data-nav="${key}" class="${route===key||['classroom','projectlesson','projectreport','lab','dragonpath','curriculum'].includes(route)&&key==='guide'||['home','learn','bank','test','wrong','lesson','session','report'].includes(route)&&key==='basics'?'active':''}" ${route===key?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-foot">先看懂，再独立完成。<br>进度自动保存在本机。<br>换设备前记得导出备份。</div></aside><main class="main"><div id="conflict" class="hidden"></div>${route==='home'?'':resumeStrip()}${content}</main></div>`;updateStatus()}
function basics(){return `<div class="academy-basics">${header('基础练习','练心算、记忆、观察、空间和规划。先学一个方法，再做一组小题。')}<div class="basics-tools"><button class="btn" data-nav="wrong">复习错题</button><button class="btn" data-nav="test">基础六维测评</button><button class="btn" data-nav="bank">浏览全部1,080题</button></div><section class="academy-curriculum">${E.TYPES.map((t,i)=>`<article class="academy-course-row"><span class="academy-number">${String(i+1).padStart(2,'0')}</span><div><h3>${t.name}</h3><p>${t.desc}</p><small>${t.dim} · ${S.get().lessons[t.id]?.done?'方法课已学完':'先看方法与例题'}</small></div><div class="actions">${button('方法与例题','lesson','',`data-type="${t.id}"`)}${button('练5道基础题','start-type','',`data-type="${t.id}" data-level="1"`)}</div></article>`).join('')}</section></div>`}
function learn(){let s=S.get(),done=Object.values(s.lessons).filter(x=>x.done).length;return `<div class="wide">${header('先学方法，再上题库。','每节课围绕一个可执行的方法：读懂规则、看示例、做一组练习、复盘错误。课程为本站新编内容。')}<div class="statusline">已完成 ${done} / 9 节方法课</div><div class="progress"><i style="width:${done/9*100}%"></i></div><div class="row-list">${E.TYPES.map((t,i)=>`<article class="list-row"><div class="numberline muted">${String(i+1).padStart(2,'0')}</div><div class="grow"><h3>${t.dim} · ${L[t.id].title}</h3><p class="muted">${t.lesson}${s.lessons[t.id]?.done?' · 已学完':''}</p></div>${button(s.lessons[t.id]?.done?'再次学习':'开始学习','lesson','',`data-type="${t.id}"`)}</article>`).join('')}</div></div>`}
function lesson(){let t=E.TYPES.find(x=>x.id===lessonId);if(!t){route='learn';return learn()}let l=L[t.id],saved=S.get().lessons[t.id],example=E.question(`v1-${t.id}-1-01`);return `<div class="wide">${button('返回课程','learn-back','ghost')}${header(l.title,l.intro)}<div class="lesson-text">${l.steps.map((x,i)=>`<div class="step"><strong>0${i+1}</strong>${x}</div>`).join('')}<div class="callout"><h3>演示例题</h3><p>${l.example}</p><h3>${example.prompt}</h3>${basicExample(example)}<details class="basic-worked-answer"><summary>展开答案与讲解</summary>${solutionView(example)}<p>${example.explain}</p></details></div><h3>常见错误</h3><p>${l.pitfall}</p><h3>怎么判断可以加难</h3><p>${l.goal}</p><p class="muted">与节目关系：${t.program}</p><label class="inline-label" for="lesson-note">学习笔记（自动保存）</label><textarea id="lesson-note" data-note="${t.id}" rows="4" placeholder="记下你的方法和容易错的地方">${esc(saved?.note||'')}</textarea><div class="actions section">${button(saved?.done?'已学完 · 再次登记':'标记本课已学完','lesson-done','',`data-type="${t.id}"`)}${button('去做5道基础练习','start-type','primary',`data-type="${t.id}" data-level="1"`)}</div><div data-save>${savedStatus()}</div></div></div>`}
function basicExample(q){if(q.type==='slide')return `<p>起始盘面（空白格是可移动空位）：</p>${matrix(q.start,q.n)}`;if(q.type==='color')return `<p>先观察颜色与位置，再遮住回忆：</p>${matrix(q.solution,q.n,{color:true})}`;if(q.type==='digits')return `<p class="numbers">${q.solution}</p><p>遮住上面的数字后，按原顺序写出。</p>`;return questionBody(q,{answer:E.initial(q),phase:'answer'},true)}
function bank(){let filtered=E.TYPES.filter(t=>(bankDim==='全部'||t.dim===bankDim)&&(!search||[t.name,t.dim,t.desc].join('').includes(search)));let s=S.get(),first=firstRecords();let body=`<label class="inline-label" for="bank-search">搜索题型</label><input id="bank-search" placeholder="例如：滑块、记忆、公约数" value="${attr(search)}" style="width:320px"><div class="filters" aria-label="能力筛选">${['全部',...E.DIMS].map(d=>`<button class="chip ${d===bankDim?'selected':''}" data-action="bank-dim" data-dim="${d}">${d}</button>`).join('')}</div><div class="filters" aria-label="难度筛选">${E.LEVELS.map((l,i)=>`<button class="chip ${bankLevel===i+1?'selected':''}" data-action="bank-level" data-level="${i+1}">${l}</button>`).join('')}</div>`;
if(bankType){let t=E.TYPES.find(x=>x.id===bankType),qs=E.BANK.filter(id=>id.startsWith(`v1-${bankType}-${bankLevel}-`)),page=qs.slice(bankPage*10,bankPage*10+10);body+=`<div class="section">${button('返回题型列表','bank-back','ghost')}<h2>${t.dim} · ${t.name} · ${E.LEVELS[bankLevel-1]}</h2><p class="muted">${t.program} 每档40题，固定编号可重做。${bankType==='slide'?'基础最短6–8步；进阶12–14步；挑战为4×4浅层8–10步。':''}</p><div class="table-wrap"><table class="data-table"><thead><tr><th>题号</th><th>首次提交</th><th>复习状态</th><th>练习</th></tr></thead><tbody>${page.map(qid=>{let r=first.get(qid),rev=s.reviews[qid];return `<tr><td class="numberline">${qid}</td><td>${r?r.ok?'完整答对':`部分分 ${pct(r.part)}`:'未练'}</td><td>${rev?rev.streak?'待间隔巩固':'待纠正':'—'}</td><td>${button('做这道','single','',`data-qid="${qid}"`)}</td></tr>`}).join('')}</tbody></table></div><div class="pagination"><button class="btn" data-action="bank-prev" ${bankPage===0?'disabled':''}>上一页</button><span>${bankPage+1} / 4</span><button class="btn" data-action="bank-next" ${bankPage===3?'disabled':''}>下一页</button></div></div>`}
else body+=`<div class="row-list">${filtered.length?filtered.map(t=>{let qs=E.BANK.filter(id=>id.startsWith(`v1-${t.id}-${bankLevel}-`)),n=qs.filter(id=>first.has(id)).length;return `<article class="list-row"><div class="grow"><h3>${t.dim} · ${t.name}</h3><p class="muted">${t.desc}</p><div class="topic-count">${E.LEVELS[bankLevel-1]} · 40题 · 已首次提交 ${n} 题</div></div><div class="actions">${button('学习方法','lesson','ghost',`data-type="${t.id}"`)}${button('浏览题目','browse-type','',`data-type="${t.id}"`)}${button('练5题','start-type','primary',`data-type="${t.id}" data-level="${bankLevel}"`)}</div></article>`}).join(''):'<div class="empty">没有匹配题型，换一个关键词试试。</div>'}</div>`;return `<div class="wide">${header('分级题库','9种题型 × 3档 × 每档40题，共1,080道固定编号生成题。先做同档新题，再用原题纠错；随机选题优先避开已做题。')}${body}</div>`}
function testPage(){let sessions=S.get().sessions.filter(x=>x.mode==='assessment');return `<div class="wide">${header('用新题，测一次当前状态。','基础六维测评共12题，每维2题，整节限时18分钟；题型和时间为本站设定，没有官方常模，不用于判断参赛资格。')}<div class="callout"><p>测评中不显示答案，交卷后统一复盘。切到后台或恢复中断会被标记，不能与完整首次测评直接比较。计时在离开页面时继续。</p></div><div class="section"><h2>基础六维测评</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>能力</th><th>内容</th><th>题数</th></tr></thead><tbody>${E.DIMS.map(d=>`<tr><td>${d}</td><td>${E.TYPES.filter(x=>x.dim===d).map(x=>x.name).join(' / ')}</td><td>2</td></tr>`).join('')}</tbody></table></div><div class="actions section">${button('开始基础六维测评','assessment','primary')}${S.get().current?.mode==='assessment'?button('继续本次测评','resume'):''}</div></div><section><h2>测评记录</h2>${sessions.length?sessionRows(sessions):'<div class="empty"><h3>还没有新测评</h3><p>旧版六维成绩单独保留在今日训练页。</p></div>'}</section></div>`}
function wrong(){let now=Date.now(),s=S.get(),all=Object.entries(s.reviews),rows=all.filter(([qid,r])=>reviewFilter==='all'||r.dueAt<=now).sort((a,b)=>a[1].dueAt-b[1].dueAt);return `<div class="wide">${header('把错题，练成会的方法。','首次答错进入复习；重做答对后安排1天、3天、7天的间隔检查。同一天反复答对只计一次巩固。中断题不增加巩固次数。')}<div class="filters"><button class="chip ${reviewFilter==='due'?'selected':''}" data-action="review-filter" data-filter="due">到期 ${all.filter(x=>x[1].dueAt<=now).length}</button><button class="chip ${reviewFilter==='all'?'selected':''}" data-action="review-filter" data-filter="all">全部 ${all.length}</button></div>${rows.length?`<div class="actions section">${button('复习当前前5题','review-due','primary')}</div><div class="row-list">${rows.map(([qid,r])=>{let q=E.question(qid);return `<article class="list-row"><div class="grow"><div class="review-label">${r.streak?'已纠正 · 跨日巩固 '+r.streak+' 次':'待纠正'} · ${r.dueAt<=now?'已到期':'下次 '+stamp(r.dueAt)}</div><h3>${q.dim} · ${q.name} · ${E.LEVELS[q.level-1]}</h3><p class="muted">${qid} · 错因：${esc(r.reason)} · 记录 ${r.attempts} 次</p></div>${button('重做原题','review-one','',`data-qid="${qid}"`)}</article>`}).join('')}</div>`:'<div class="empty"><h3>当前没有到期错题</h3><p>继续做同档新题，检验方法是否能迁移。</p></div>'}</div>`}
function firstRecords(){let m=new Map;for(let r of S.get().records){if(r.mode!=='review'&&r.status==='submitted'&&!r.interrupted&&!m.has(r.qid))m.set(r.qid,r)}return m}
function median(a){if(!a.length)return 0;let s=a.slice().sort((a,b)=>a-b),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function sessionRows(rows){return `<div class="row-list">${rows.slice().reverse().slice(0,50).map(c=>{let records=S.get().records.filter(r=>r.sessionId===c.id),submitted=records.filter(r=>r.status==='submitted');return `<article class="list-row"><div class="grow"><h3>${esc(c.label)}${c.interrupted?' · 有中断':''}</h3><p class="muted">${stamp(c.endedAt)} · 已提交 ${submitted.length}/${c.queue.length} · 完整答对 ${submitted.filter(x=>x.ok).length} 题</p></div>${button('查看复盘','report','',`data-id="${c.id}"`)}</article>`}).join('')}</div>`}
function canStart(){if(S.get().projectLab.active){toast('有一场项目练习尚未结束。');navigate('lab');return false}if(S.get().arena.active){toast('请先结束比赛专项，再开始基础练习。');navigate('arena');return false}if(S.conflict()){toast('存档已被另一页面更新，请先导出再重新载入。');return false}if(S.get().current){toast('你有未完成训练。请继续，或先在练习页结束并存档。');navigate('session');return false}return true}
function begin(mode,label,queue){if(!canStart())return;let at=Date.now();S.commit(s=>{s.current={id:id(),mode,label,queue,index:0,startedAt:at,deadline:mode==='assessment'?at+18*60000:null,resultIds:[],active:null,interrupted:false}});ensureActive();navigate('session')}
function seenIds(){return S.get().records.filter(r=>r.status==='submitted').map(r=>r.qid)}
function select(type,level,count=5){return E.select({type,level,count,seen:seenIds()})}
function ensureActive(){let c=S.get().current;if(!c||c.active||c.index>=c.queue.length)return;let q=E.question(c.queue[c.index]);S.commit(s=>{s.current.active={answer:E.initial(q),phase:['color','digits'].includes(q.type)?'ready':'answer',until:null,startedAt:Date.now(),reason:'',interrupted:false}})}
function patchAnswer(fn,redraw=true){let ok=S.commit(s=>{if(s.current?.active&&s.current.active.phase!=='done')fn(s.current.active,s.current)});if(ok&&redraw)render()}
function attempted(a,q){return ['rotate','mod9','detail'].includes(q.type)?a!==null:['digits','arithmetic'].includes(q.type)?E.normalize(a)!=='' :q.type==='gcd'?a.length>0:q.type==='slide'?a.moves>0:a.some(x=>x!==0&&x!=='')}
function submit(status='submitted',auto=false){let c=S.get().current;if(!c||!c.active||c.active.phase==='done')return;let q=E.question(c.queue[c.index]),a=c.active;if(status==='submitted'&&!attempted(a.answer,q)&&!auto){toast('请先作答，或选择跳过这题。');return}let grade=status==='submitted'?E.grade(q,a.answer):{ok:false,part:0,detail:status==='timeout'?'时间到，未提交':'跳过'};let advance=c.mode==='assessment';S.commit(s=>{let c=s.current,a=c.active;let record={id:c.id+'-'+c.index,sessionId:c.id,qid:q.id,at:Date.now(),mode:c.mode,status,answer:a.answer,elapsed:Math.max(0,Date.now()-a.startedAt),reason:a.reason||'',interrupted:!!(a.interrupted||c.interrupted),...grade};S.addRecord(s,record);if(!c.resultIds.includes(record.id))c.resultIds.push(record.id);a.phase='done';if(advance){c.index++;c.active=null}});if(advance){if(S.get().current.index>=S.get().current.queue.length)finish(false);else{ensureActive();render()}}else render()}
function next(){let c=S.get().current;if(!c)return;S.commit(s=>{s.current.index++;s.current.active=null});if(S.get().current.index>=S.get().current.queue.length)finish(false);else{ensureActive();render();window.scrollTo(0,0)}}
function finish(timeout=false){let c=S.get().current;if(!c)return;let sessionId=c.id;if(c.mode==='assessment'){
 S.commit(s=>{let c=s.current;for(let i=c.index;i<c.queue.length;i++){let q=E.question(c.queue[i]),a=i===c.index?c.active:null,has=a&&attempted(a.answer,q)&&a.phase!=='ready'&&a.phase!=='memorize',status=has?'submitted':timeout?'timeout':'skipped',grade=has?E.grade(q,a.answer):{ok:false,part:0,detail:timeout?'时间到未答':'提前结束未答'},r={id:c.id+'-'+i,sessionId:c.id,qid:q.id,at:Date.now(),mode:c.mode,status,answer:a?.answer??E.initial(q),elapsed:a?Math.max(0,Date.now()-a.startedAt):0,reason:a?.reason||'',interrupted:!!(c.interrupted||a?.interrupted),...grade};S.addRecord(s,r);if(!c.resultIds.includes(r.id))c.resultIds.push(r.id)}})
 }else if(c.active&&c.active.phase!=='done'&&attempted(c.active.answer,E.question(c.queue[c.index]))){submit('submitted',true)}
 S.commit(s=>{let c=s.current;s.sessions.push({...c,active:null,endedAt:Date.now(),finished:c.index>=c.queue.length||(c.mode!=='assessment'&&c.index===c.queue.length-1&&c.active?.phase==='done')});s.current=null});reportId=sessionId;navigate('report');if(timeout)toast('时间到，本次作答已结算并存档。')}
function matrix(cells,n,{click='',selected=null,path=null,mod=false,color=false,small=false}={}){return `<div class="matrix" style="--n:${n}">${cells.map((v,i)=>{let active=click,style=color?`background:${COLORS[v]||COLORS[0]};`:mod?`background:${MOD[v]};color:${v===0?'white':'#252638'};`:'';let cls=`cell ${active?'interactive':''} ${!color&&!mod&&v===1&&!click?'on':''} ${selected===i?'selected':''} ${path?.includes(i)?'path':''}`;let order=path?.indexOf(i);let value=color?`${v}`:mod?`${v}`:v===0&&!click?'':v;return active?`<button class="${cls}" style="${style}" data-action="${click}" data-cell="${i}" ${color?'data-color-cell="'+i+'"':''} aria-label="第${Math.floor(i/n)+1}行第${i%n+1}列${color?'，颜色'+v:''}">${esc(value)}${order>=0?`<small class="path-order">第${order+1}步</small>`:''}</button>`:`<div class="${cls}" style="${style}">${small&&!mod?'':esc(value)}</div>`}).join('')}</div>`}
function questionBody(q,a,feedback=false){let disabled=feedback?'disabled':'';if(q.type==='rotate')return `<h3>原图</h3>${matrix(q.target,q.n,{small:true})}<div class="opts">${q.options.map((x,i)=>`<button class="option ${a.answer===i?'selected':''}" data-action="choose" data-value="${i}" aria-label="选项${'ABCD'[i]}" ${disabled}><span>${'ABCD'[i]}</span>${matrix(x,q.n,{small:true})}</button>`).join('')}</div>`;
if(q.type==='mod9')return `<p class="muted">黑0 · 红1 · 橙2 · 黄3 · 绿4 · 青5 · 蓝6 · 紫7 · 白8</p><div class="pair"><div><h3>拼片A</h3>${matrix(q.a,q.n,{mod:true})}</div><div><h3>叠色结果</h3>${matrix(q.sum,q.n,{mod:true})}</div></div><div class="opts">${q.options.map((x,i)=>`<button class="option ${a.answer===i?'selected':''}" data-action="choose" data-value="${i}" aria-label="选项${'ABCD'[i]}" ${disabled}><span>${'ABCD'[i]}</span>${matrix(x,q.n,{mod:true})}</button>`).join('')}</div>`;
if(q.type==='detail')return `<div class="pair"><div><h3>原图</h3>${matrix(q.target,q.n)}</div><div><h3>点击下图的不同格</h3>${matrix(q.other,q.n,{click:feedback?'':'detail-cell',selected:a.answer})}</div></div>`;
if(q.type==='latin')return `<div class="matrix" style="--n:${q.n}">${q.clues.map((v,i)=>v?`<div class="cell fixed">${v}</div>`:`<label class="cell"><input class="cellinput" data-latin="${i}" value="${attr(a.answer[i])}" inputmode="numeric" maxlength="2" aria-label="第${Math.floor(i/q.n)+1}行第${i%q.n+1}列" ${disabled}></label>`).join('')}</div>`;
if(q.type==='gcd')return `${matrix(q.values,q.n,{click:feedback?'':'path-cell',path:a.answer})}<p class="statusline">已连 ${a.answer.length}/${q.n*q.n} 格；点当前终点可退一步。</p>${feedback?'':button('清空路径','clear-path')}`;
if(q.type==='slide')return `<div class="matrix" style="--n:${q.n}">${a.answer.board.map((v,i)=>`<button class="cell ${v?'interactive':'fixed'}" data-action="slide-cell" data-cell="${i}" aria-label="${v?'移动'+v:'空位'}" ${!v||feedback?'disabled':''}>${v||''}</button>`).join('')}</div><p class="statusline">累计移动 ${a.answer.moves} 步。每次只移动一格，重置不清零步数。</p>${feedback?'':button('重置盘面','reset-slide')}`;
if(q.type==='arithmetic')return `<div class="calculation">${q.text} = ?</div><label class="inline-label" for="answer-field">你的答案</label><input id="answer-field" class="answer-field" data-answer type="text" inputmode="text" autocomplete="off" value="${attr(a.answer)}" ${disabled}>`;
if(['color','digits'].includes(q.type)){
 if(a.phase==='ready')return `<div class="callout"><p>准备好再开始。展示 ${q.seconds} 秒，到时自动遮住；展示期间切到后台会被标记为中断。</p>${button('开始记忆','memory-start','primary')}</div>`;
 if(a.phase==='memorize')return `<div class="statusline">还有 <strong data-memory-clock>${Math.max(0,Math.ceil((a.until-Date.now())/1000))}</strong> 秒，然后自动遮住。</div>${q.type==='color'?matrix(q.solution,q.n,{color:true}):`<div class="numbers" aria-label="待记忆数字串">${q.solution}</div>`}`;
 return q.type==='color'?`<div class="palette"><span>0 空</span><span>1 红</span><span>2 黄</span><span>3 蓝</span></div>${matrix(a.answer,q.n,{click:feedback?'':'color-cell',color:true})}<p class="muted">点击格子循环切色；聚焦格子后可按0–3直接设置。</p>`:`<label class="inline-label" for="answer-field">按原顺序输入（保留开头的0）</label><input id="answer-field" class="answer-field" data-answer inputmode="numeric" autocomplete="off" value="${attr(a.answer)}" ${disabled}>`;
}return ''}
function solutionView(q){if(q.type==='rotate'||q.type==='mod9')return `<p>正确选项：<strong>${'ABCD'[q.solution]}</strong></p>${matrix(q.options[q.solution],q.n,{mod:q.type==='mod9',small:q.type==='rotate'})}`;if(q.type==='detail')return `<p>第${Math.floor(q.solution/q.n)+1}行，第${q.solution%q.n+1}列。</p>`;if(q.type==='color')return matrix(q.solution,q.n,{color:true});if(q.type==='latin')return matrix(q.solution,q.n);if(q.type==='gcd')return `<p class="numberline">${q.solution.map(i=>`(${Math.floor(i/q.n)+1},${i%q.n+1})`).join(' → ')}</p>`;if(q.type==='slide')return `<p>最短 ${q.optimal} 步。你的移动轨迹按点击的方块记录在存档中。</p>${matrix(q.solution,q.n)}`;return `<p class="numberline">参考答案：<strong>${q.solution}</strong></p>`}
function feedbackView(q,r,editable=false){return `<section class="feedback ${r.ok?'':'bad'}"><h3>${r.status!=='submitted'?'本题未提交':r.ok?'完整答对':'还需要再练'}${r.status==='submitted'&&!r.ok&&r.part>0?` · 部分分 ${pct(r.part)}`:''}</h3><p>${esc(r.detail)}${r.detail?' · ':''}用时 ${sec(r.elapsed)}${r.interrupted?' · 有中断，不计有效首次基线':''}</p><div class="solution"><h3>答案与方法</h3>${solutionView(q)}<p>${q.explain}</p></div>${editable&&!r.ok&&r.status==='submitted'?`<label class="inline-label" for="error-reason">这次主要错在哪里？（保存到复习记录）</label><select id="error-reason" data-reason><option value="">请选择错因</option>${['进位或借位','颜色与位置混淆','读题或坐标','规划循环','操作失误','方法不熟','其他'].map(x=>`<option ${r.reason===x?'selected':''}>${x}</option>`).join('')}</select>`:''}</section>`}
function sessionView(){let c=S.get().current;if(!c)return `<div class="wide">${header('当前没有未完成训练','从今日训练或分级题库开始。')}${button('去题库','go-bank','primary')}</div>`;if(!c.active)ensureActive();c=S.get().current;let a=c.active,q=E.question(c.queue[c.index]),r=S.get().records.find(x=>x.id===c.id+'-'+c.index),isDone=a.phase==='done';return `<div class="q-layout"><header class="q-head"><div><h1>${esc(c.label)}</h1><div class="muted">第 ${c.index+1} / ${c.queue.length} 题 · ${q.dim} · ${E.LEVELS[q.level-1]} · ${q.id}</div></div><div class="clock" data-test-clock>${c.deadline?formatClock(c.deadline-Date.now()):''}</div></header><div class="progress"><i style="width:${c.index/c.queue.length*100}%"></i></div>${c.interrupted||a.interrupted?'<div class="callout warning">本次存在展示中断或恢复。作答仍保存，但不计入有效首次基线。</div>':''}<section class="question"><h2>${q.prompt}</h2><div class="q-description">${q.program}</div>${questionBody(q,a,isDone)}${isDone&&r?feedbackView(q,r,true):''}<div class="q-actions">${isDone?button(c.index+1===c.queue.length?'完成并存档':'下一题','next','primary'):a.phase==='answer'?button(c.mode==='assessment'?'提交，继续下一题':'提交答案','submit','primary'):''}${!isDone?button('跳过这题','skip'):''}${button('结束并存档','finish','end')}</div></section><div data-save>${savedStatus()}</div><p class="q-foot">当前输入、盘面和训练进度自动保存在本机。中途退出可继续；测评截止时间不会因刷新延后。记忆题在展示中断后不会重新展示答案。</p></div>`}
function report(){let c=S.get().sessions.find(x=>x.id===reportId)||S.get().sessions.at(-1);if(!c)return `<div class="wide">${header('还没有训练存档','先完成一组练习。')}${button('开始今日训练','today','primary')}</div>`;let all=S.get().records.filter(x=>x.sessionId===c.id),a=all.filter(x=>x.status==='submitted');return `<div class="wide">${header(esc(c.label)+' · 训练复盘',`${stamp(c.endedAt)} · ${c.finished?'整组已完成':'提前结束'}${c.interrupted?' · 有中断，仅供练习':''}`)}<div class="smallstats"><div class="stat"><strong>${a.length}/${c.queue.length}</strong><span>提交题数 / 计划题数</span></div><div class="stat"><strong>${a.filter(x=>x.ok).length}</strong><span>完整答对题数</span></div><div class="stat"><strong>${a.length?pct(a.reduce((v,r)=>v+r.part,0)/a.length):'—'}</strong><span>已提交题目部分分均值</span></div><div class="stat"><strong>${a.length?sec(median(a.map(x=>x.elapsed))):'—'}</strong><span>题目用时中位数</span></div></div><p class="muted">这些数字描述本次题组，不是智力分或节目资格线；重做题与首次题请在训练档案中分开比较。</p>${E.DIMS.map(d=>{let qs=c.queue.filter(qid=>E.question(qid).dim===d);if(!qs.length)return '';let rs=all.filter(r=>E.question(r.qid).dim===d),ok=rs.filter(x=>x.ok).length;return `<div class="meter-row"><strong>${d}</strong><div class="bar"><i style="width:${ok/qs.length*100}%"></i></div><span>${ok}/${qs.length} 全对</span></div>`}).join('')}<div class="actions section">${button('导出完整存档','export','primary')}${button('去错题复习','go-wrong')}${button('返回学习路线','go-home')}</div><h2>逐题复盘</h2>${all.map((r,i)=>{let q=E.question(r.qid);return `<details class="panel"><summary>${i+1}. ${q.dim} · ${q.name} · ${r.status==='submitted'?r.ok?'完整答对':'需复习':r.status==='timeout'?'时间到未答':'跳过'} · ${sec(r.elapsed)}</summary><p class="q-description">题号 ${q.id}</p><h3>你的作答</h3>${answerSummary(q,r.answer)}${feedbackView(q,r)}</details>`}).join('')}</div>`}
function answerSummary(q,a){if(q.type==='color')return matrix(a,q.n,{color:true});if(q.type==='latin')return matrix(q.clues.map((x,i)=>x||a[i]||'·'),q.n);if(q.type==='slide')return `${matrix(a.board,q.n)}<p>累计 ${a.moves} 步</p>`;if(q.type==='gcd')return `<p>${a.map(i=>`(${Math.floor(i/q.n)+1},${i%q.n+1})`).join(' → ')||'未连线'}</p>`;if(['rotate','mod9'].includes(q.type))return `<p>${a===null?'未选择':'选项 '+'ABCD'[a]}</p>`;if(q.type==='detail')return `<p>${a===null?'未选择':`第${Math.floor(a/q.n)+1}行第${a%q.n+1}列`}</p>`;return `<p class="numberline">${esc(a)||'空'}</p>`}
function formatClock(ms){let n=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function downloadBackup(){let text=S.exportText(),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='脑力研习室-完整存档-'+S.day(Date.now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('已生成完整存档，请确认下载文件已保存。')}
function prepareImport(text){try{prepared=S.prepareImport(text);let d=document.getElementById('restore-dialog');d.innerHTML=`<h2>恢复这个存档？</h2><p>包含 ${prepared.records.length} 条逐题记录、${prepared.sessions.length} 次基础训练、${prepared.arena.records.length} 场比赛专项、${Object.keys(prepared.lessons).length} 节基础课程笔记、${Object.values(prepared.academy.courses).filter(x=>x.done).length} 门已通过的专项入门课、${prepared.projectLab.records.length} 场新增项目训练、${Object.values(prepared.projectLab.lessons).filter(x=>x.done).length} 门新增项目跟练、${prepared.dragonPath.levels.filter(x=>x.passed).length} 档神龙分级课、${Object.values(prepared.curriculum.courses).reduce((n,c)=>n+c.levels.filter(l=>l.passed).length,0)} 档其他项目分级课${prepared.current||prepared.arena.active||prepared.projectLab.active?'，以及未完成训练草稿':''}。</p><p class="muted">恢复会替换当前浏览器中的本站存档。建议先下载当前副本。恢复中的测评会标记中断，原截止时间继续。</p><div class="actions">${button('先下载当前副本','export')}${button('取消','cancel-import')}${button('确认恢复并替换','apply-import','primary')}</div>`;d.showModal()}catch(e){toast('无法导入：'+e.message);let el=document.getElementById('import-status');if(el)el.textContent='无法导入：'+e.message}}
function action(el){let a=el.dataset.action,c=S.get().current;switch(a){

case'detail-cell':if(c?.active.phase==='answer')patchAnswer(x=>x.answer=+el.dataset.cell);break;

case'path-cell':if(c?.active.phase==='answer'){let q=E.question(c.queue[c.index]),i=+el.dataset.cell,last=c.active.answer.at(-1);if(last===i){patchAnswer(x=>x.answer.pop())}else if(c.active.answer.includes(i)){toast('这个格子已经走过。')}else if(last===undefined||E.neighbors(last,q.n).includes(i)&&E.gcd(q.values[last],q.values[i])>1){patchAnswer(x=>x.answer.push(i))}else toast('只能走相邻且有大于1公约数的格子。')}break;
